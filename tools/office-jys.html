<style>
#jooffice{background:#feefb8;overflow:auto;font-family:Pretendard,-apple-system,sans-serif;color:#432f2e;display:none;min-width:0;min-height:0}
body.locked #jooffice,body.locked #jobtn{display:none!important}
.rt-toggle,.m-aot-on{display:none!important}   /* 레트로·진격 테마(대표님 전용) 버튼 숨김 */
.jo-wrap{padding:18px 18px 40px}
.jo-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.jo-top h1{font-size:24px;font-weight:900;margin:0}.jo-top p{margin:4px 0 0;opacity:.7;font-size:14px}
.jo-go{border:3px solid #432f2e;background:#432f2e;color:#feefb8;border-radius:99px;padding:10px 18px;font:800 15px Pretendard,sans-serif;cursor:pointer;box-shadow:3px 3px 0 #f6d36b}
.jo-floor{margin-top:14px;border:4px solid #432f2e;border-radius:20px;padding:18px;background-color:#f3e6cf;background-image:linear-gradient(45deg,#ead9bd 25%,transparent 25%,transparent 75%,#ead9bd 75%),linear-gradient(45deg,#ead9bd 25%,transparent 25%,transparent 75%,#ead9bd 75%);background-size:44px 44px;background-position:0 0,22px 22px}
.jo-boss{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.jo-boss img{width:126px;image-rendering:pixelated}
.jo-boss .nm{background:#f6d36b;border:3px solid #432f2e;border-radius:14px;padding:8px 14px;text-align:center}
.jo-boss .nm b{display:block;font-size:21px;font-weight:900}.jo-boss .nm small{font-size:12px;opacity:.75}
.jo-say{background:#fff;border:3px solid #432f2e;border-radius:14px;padding:10px 14px;font-weight:800;font-size:15px;box-shadow:4px 4px 0 #432f2e;max-width:300px}
.jo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:12px}
.jo-room{position:relative;background:rgba(255,255,255,.75);border:3px solid #432f2e;border-radius:14px;padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:inherit;color:inherit;animation:join .45s both;animation-delay:calc(var(--i) * .1s + .15s)}
.jo-room:hover{transform:translateY(-3px);box-shadow:4px 4px 0 #432f2e;background:#fff}
.jo-room img{width:88px;image-rendering:pixelated;margin-top:4px}
.jo-room b{font-size:17px;font-weight:900;margin-top:2px}
.jo-room small{font-size:11.5px;opacity:.7;text-align:center;line-height:1.3}
.jo-room em{font-style:normal;font-size:11.5px;font-weight:800;color:#2f8a4a;margin-top:2px}
.jo-room.busy{background:#fff;border-color:#e0483d;box-shadow:0 0 0 4px rgba(224,72,61,.18)}
.jo-room.busy em{color:#e0483d}.jo-room.busy img{animation:jotype .35s steps(2) infinite}
@keyframes jotype{50%{transform:translateY(-3px)}}
.jo-dept{background:#432f2e;color:#feefb8;font-size:12px;font-weight:800;padding:2px 9px;border-radius:99px}
@keyframes join{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
.jo-tip{text-align:center;margin-top:12px;font-size:13px;opacity:.7}
#jobtn{position:fixed;right:14px;bottom:96px;z-index:8000;border:3px solid #432f2e;background:#f6d36b;color:#432f2e;border-radius:99px;padding:9px 15px;font:800 14px Pretendard,sans-serif;cursor:pointer;box-shadow:3px 3px 0 #432f2e}
/* 컴퓨터 (넓은 화면): 3단 — 왼쪽 위 자료실·바로가기·달력, 왼쪽 아래 할일 / 가운데 사무실 / 오른쪽 채팅 */
@media (min-width:1101px){
  body.jox:not(.locked) aside{position:fixed!important;left:0;top:0;width:300px!important;max-width:none!important;height:54vh;transform:none!important;display:flex!important;overflow-y:auto;border-right:1px solid var(--line);border-bottom:2px solid var(--line);box-shadow:none!important;z-index:20}
  body.jox:not(.locked) .todo{position:fixed!important;left:0;top:54vh;width:300px;height:46vh;display:flex!important;z-index:20}
  body.jox:not(.locked) #jooffice{display:block;position:fixed;left:300px;right:440px;top:0;bottom:0;z-index:10}
  body.jox:not(.locked) main{position:fixed!important;right:0;top:0;width:440px;height:100dvh;border-left:3px solid #432f2e;z-index:20;display:flex;flex-direction:column}
  body.jox .todo-fold,body.jox .todo-unfold,body.jox .jo-go,body.jox #jobtn,body.jox .drawer-close{display:none!important}
  body.jox .threads{display:none}
}

@media (max-width:1100px){
  #jooffice.show{display:block;position:fixed;inset:0;z-index:9000}
  .jo-grid{grid-template-columns:repeat(2,1fr)}.jo-room img{width:78px}.jo-boss img{width:100px}
}

  if (localStorage.getItem("retro") === "1" || B.classList.contains("retro")) { localStorage.setItem("retro", "0"); localStorage.removeItem("rtTheme"); location.reload(); return; }   // 조사병단 본부(레트로) 화면이 켜져 있었으면 끄고 다시 연다
  B.classList.add("jox");
  const main = document.querySelector("main"); if (main) main.parentNode.insertBefore(of, main);   // 가운데 칸 자리로
  const open = () => { of.classList.add("show"); };
  const toChat = (dept) => { of.classList.remove("show"); const i = inp(); if (i) { if (dept) i.value = "[" + dept + "] "; i.focus(); i.dispatchEvent(new Event("input", { bubbles: true })); } };
  document.getElementById("jogo").onclick = () => toChat("");
  document.getElementById("jobtn").onclick = open;
  of.querySelectorAll(".jo-room").forEach((r) => r.onclick = () => toChat(r.dataset.dept));
  // 지금 일하는 부서 표시 — 위쪽 부서 표시(#tag)·진행 글(#what)을 보고 그 직원 자리에 '일하는 중'
  const tag = document.getElementById("tag"), what = document.getElementById("what"), say = document.getElementById("josay");
  const mark = () => {
    const t = (tag && tag.textContent || "") + " " + (what && what.textContent || ""), idle = /대기 중/.test(what && what.textContent || "");
    let any = "";
    of.querySelectorAll(".jo-room").forEach((r) => { const d = r.dataset.dept.replace(/^\d+\s*/, ""), on = !idle && t.includes(d); r.classList.toggle("busy", on); r.querySelector("em").textContent = on ? "✍️ 일하는 중" : "● 출근"; if (on) any = r.querySelector("b").textContent; });
    if (say) say.textContent = idle ? "대표님, 오늘은 무엇부터 할까요?" : (any ? any + "에게 맡겼습니다. 끝나면 바로 보고드릴게요." : "말씀하신 일을 처리하고 있어요.");
  };
  [tag, what].forEach((el) => el && new MutationObserver(mark).observe(el, { childList: true, characterData: true, subtree: true }));
  mark();
  if (innerWidth <= 1100) {
    if (!B.classList.contains("locked")) open();
    else new MutationObserver((m, ob) => { if (!B.classList.contains("locked")) { ob.disconnect(); open(); } }).observe(B, { attributes: true, attributeFilter: ["class"] });
  }
})();
</script>
