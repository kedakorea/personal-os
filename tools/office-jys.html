<style>
#office{position:fixed;inset:0;z-index:9000;background:#feefb8;overflow:auto;font-family:Pretendard,-apple-system,sans-serif;color:#432f2e;display:none}
body.locked #office{display:none!important}
#office.show{display:block}
.of-wrap{max-width:1180px;margin:0 auto;padding:26px 22px 60px}
.of-top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.of-top h1{font-size:30px;font-weight:900;margin:0}.of-top p{margin:6px 0 0;opacity:.7;font-size:16px}
.of-go{border:3px solid #432f2e;background:#432f2e;color:#feefb8;border-radius:99px;padding:12px 22px;font:800 17px Pretendard,sans-serif;cursor:pointer;box-shadow:4px 4px 0 #f6d36b}
.of-floor{margin-top:20px;border:4px solid #432f2e;border-radius:22px;padding:22px;background-color:#f3e6cf;background-image:linear-gradient(45deg,#ead9bd 25%,transparent 25%,transparent 75%,#ead9bd 75%),linear-gradient(45deg,#ead9bd 25%,transparent 25%,transparent 75%,#ead9bd 75%);background-size:48px 48px;background-position:0 0,24px 24px}
.of-boss{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.of-boss img{width:150px;image-rendering:pixelated}
.of-boss .nm{background:#f6d36b;border:3px solid #432f2e;border-radius:14px;padding:10px 16px;text-align:center}
.of-boss .nm b{display:block;font-size:24px;font-weight:900}.of-boss .nm small{font-size:13px;opacity:.75}
.of-say{background:#fff;border:3px solid #432f2e;border-radius:14px;padding:12px 16px;font-weight:800;font-size:17px;box-shadow:4px 4px 0 #432f2e}
.of-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.of-room{position:relative;background:rgba(255,255,255,.75);border:3px solid #432f2e;border-radius:16px;padding:12px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-family:inherit;color:inherit;animation:ofin .45s both;animation-delay:calc(var(--i) * .12s + .2s)}
.of-room:hover{transform:translateY(-3px);box-shadow:5px 5px 0 #432f2e;background:#fff}
.of-room img{width:104px;image-rendering:pixelated;margin-top:6px}
.of-room b{font-size:20px;font-weight:900;margin-top:4px}
.of-room small{font-size:12.5px;opacity:.7;text-align:center;line-height:1.35}
.of-room em{font-style:normal;font-size:12px;font-weight:800;color:#2f8a4a;margin-top:2px}
.of-dept{background:#432f2e;color:#feefb8;font-size:13px;font-weight:800;padding:3px 10px;border-radius:99px}
@keyframes ofin{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.of-tip{text-align:center;margin-top:16px;font-size:14px;opacity:.7}
#ofbtn{position:fixed;right:16px;bottom:96px;z-index:8000;border:3px solid #432f2e;background:#f6d36b;color:#432f2e;border-radius:99px;padding:10px 16px;font:800 15px Pretendard,sans-serif;cursor:pointer;box-shadow:3px 3px 0 #432f2e}
body.locked #ofbtn{display:none}
@media(max-width:600px){.of-top h1{font-size:24px}.of-grid{grid-template-columns:repeat(2,1fr)}.of-room img{width:84px}.of-room b{font-size:17px}.of-boss img{width:110px}}
</style>

<script>
(function(){
  const of = document.getElementById("office"), inp = () => document.getElementById("input");
  const open = () => { of.classList.add("show"); of.querySelectorAll(".of-room").forEach((r) => { r.style.animation = "none"; r.offsetHeight; r.style.animation = ""; }); };
  const close = (dept) => { of.classList.remove("show"); const i = inp(); if (i) { if (dept) i.value = "[" + dept + "] "; i.focus(); i.dispatchEvent(new Event("input", { bubbles: true })); } };
  document.getElementById("ofgo").onclick = () => close("");
  document.getElementById("ofbtn").onclick = open;
  of.querySelectorAll(".of-room").forEach((r) => r.onclick = () => close(r.dataset.dept));
  if (!document.body.classList.contains("locked")) open();
  else new MutationObserver((m, ob) => { if (!document.body.classList.contains("locked")) { ob.disconnect(); open(); } }).observe(document.body, { attributes: true, attributeFilter: ["class"] });
})();
</script>
