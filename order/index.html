      M.innerHTML = `<p class="en">THANK YOU</p><h1>결제가 완료되었습니다</h1><p class="sub">주문번호 <b>${osEsc(q.get("no") || "")}</b>${j.totalAmount ? ` · ${won(j.totalAmount)}` : ""}<br>담당자가 1영업일 안에 연락드려 설치 일정을 확정합니다.</p>${KCH}${j.receipt ? `<p class="small"><a href="${osEsc(j.receipt)}" target="_blank" rel="noopener">카드 영수증 보기</a></p>` : ""}<a class="btn dark" href="../account/">마이페이지에서 주문 보기</a>`;
    } catch (e) { fail("결제 확인 중 오류가 났습니다. 문의 주시면 바로 확인해 드립니다."); }
    return;
  }
  const { data } = await sb.auth.getSession();
  if (!data.session) return needLogin();
  const u = data.session.user;
  const { data: m } = await sb.from("members").select("*").eq("id", u.id).maybeSingle();
  if (!m || !m.agree_terms_at) return needLogin();
  if (FOR && sessionStorage.getItem("for_ok") !== FOR && !same(m.name, FOR)) return forSwitch(u, m);
  form(u, m);
})();
</script>
</body></html>
