/* 예약 달력 — 평일 10:00·15:00, 오늘+3일 ~ 60일 */
(async function(){
 const sb = supabase.createClient(OS_URL, OS_ANON);
 const { data } = await sb.rpc("taken_slots");
 const taken = new Set((data && data.taken || []).map((t) => new Date(t).getTime())), blocked = new Set(data && data.blocked || []);
 const TIMES = [["10:00", "오전", "10시 ~ 14시경"], ["15:00", "오후", "15시 ~ 19시경"]];
 const kst = (d, hm) => new Date(`${d}T${hm}:00+09:00`);
 const ymd = (dt) => { const k = new Date(dt.getTime() + 9 * 3600e3); return k.toISOString().slice(0, 10); };
 const today = ymd(new Date()), addD = (s, n) => { const d = new Date(s + "T00:00:00+09:00"); d.setDate(d.getDate() + n); return ymd(d); };
 const from = addD(today, 5), to = addD(today, 60);
 const dayOk = (s) => { const dw = new Date(s + "T12:00:00+09:00").getUTCDay(); return s >= from && s <= to && dw >= 1 && dw <= 5 && !blocked.has(s) && TIMES.some(([hm]) => !taken.has(kst(s, hm).getTime())); };
 let cur = from.slice(0, 7), selD = null, selT = null;
 function draw() {
  const [y, m] = cur.split("-").map(Number), first = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(), days = new Date(Date.UTC(y, m, 0)).getUTCDate();
  document.getElementById("mt").textContent = `${y}년 ${m}월`;
  document.getElementById("pv").disabled = cur <= from.slice(0, 7); document.getElementById("nx").disabled = cur >= to.slice(0, 7);
  let h = "일월화수목금토".split("").map((d) => `<div class="dw">${d}</div>`).join("") + "<div></div>".repeat(first);
  for (let d = 1; d <= days; d++) { const s = `${cur}-${String(d).padStart(2, "0")}`, ok = dayOk(s); h += `<button data-d="${s}" class="${ok ? "ok" : ""} ${s === selD ? "sel" : ""}" ${ok ? "" : "disabled"}>${d}</button>`; }
  document.getElementById("cg").innerHTML = h;
  document.querySelectorAll("#cg button[data-d]").forEach((b) => b.onclick = () => { selD = b.dataset.d; selT = null; draw(); times(); });
 }
 function times() {
  const dw = "일월화수목금토"[new Date(selD + "T12:00:00+09:00").getUTCDay()];
  document.getElementById("th").textContent = `${+selD.slice(5, 7)}월 ${+selD.slice(8)}일 (${dw}) — 시간을 골라 주세요`;
  document.getElementById("tt").innerHTML = TIMES.map(([hm, a, r]) => { const full = taken.has(kst(selD, hm).getTime()); return `<button data-t="${hm}" class="${hm === selT ? "sel" : ""}" ${full ? "disabled" : ""}>${a} ${hm}<small>${full ? "예약 마감" : r}</small></button>`; }).join("");
  document.querySelectorAll("#tt button").forEach((b) => b.onclick = () => { selT = b.dataset.t; times(); });
  const pk = document.getElementById("pk"), go = document.getElementById("go");
  if (selT) {
   pk.hidden = false; pk.innerHTML = `선택한 일정<br><b>${+selD.slice(5, 7)}월 ${+selD.slice(8)}일 (${dw}) ${selT}</b> · ${E(P.tag)}`;
   go.disabled = false; go.textContent = `이 일정으로 구매하기 · ${won(P.price)}`;
  } else { pk.hidden = true; go.disabled = true; go.textContent = "시간을 고르면 구매할 수 있어요"; }
 }
 document.getElementById("pv").onclick = () => { const [y, m] = cur.split("-").map(Number); cur = m === 1 ? `${y - 1}-12` : `${y}-${String(m - 1).padStart(2, "0")}`; draw(); };
 document.getElementById("nx").onclick = () => { const [y, m] = cur.split("-").map(Number); cur = m === 12 ? `${y + 1}-01` : `${y}-${String(m + 1).padStart(2, "0")}`; draw(); };
 document.getElementById("go").onclick = () => { location.href = `../order/?p=${K}&slot=${encodeURIComponent(kst(selD, selT).toISOString())}`; };
 draw();
})();
</script>
</body></html>
