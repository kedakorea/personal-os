const sHop = () => tone(520 + Math.random()*80, .15, 'sine', .15), sWin = () => [523,659,784,1046].forEach((f,i) => tone(f, .5, 'triangle', .22, i*.14));
// 게임 상태
const panel = document.getElementById('panel'), prog = document.getElementById('prog');
STEPS.slice(0, 9).forEach(() => prog.appendChild(document.createElement('span')));
let at = 0, wrong = 0, used = new Set(), hop = null;
function pick(n){ const pool = OX[n] || []; const fresh = pool.filter(q => !used.has(q.q)); const L = fresh.length ? fresh : pool; const q = L[Math.floor(Math.random()*L.length)]; used.add(q.q); return q; }
function ask(){
  const s = STEPS[at]; const q = pick(s.n); window.__q = q;
  panel.style.display = ''; panel.innerHTML = `<span class="tag">${s.n.length > 2 ? s.n : 'STEP ' + s.n}</span><span class="stage">${s.t} · ${s.s}</span>
    <div class="q">${q.q}</div><div class="btns"><button class="o">O</button><button class="x">X</button></div><div class="small">공통과정 ${q.lec}강 확인 문제</div>`;
  panel.querySelector('.o').onclick = () => answer(q, 'O'); panel.querySelector('.x').onclick = () => answer(q, 'X');
}
function answer(q, a){
  const ok = a === q.a; ok ? sYes() : (sNo(), wrong++);
  panel.querySelector('.btns').remove();
  panel.insertAdjacentHTML('beforeend', `<div class="res"><b class="${ok?'y':'n'}">${ok ? '정답! 다음 칸으로' : '아쉬워요, 정답은 ' + q.a}</b><br>${q.why || ''}</div>
    <button class="go">${ok ? (at === 8 ? '2급 자격증 칸으로 →' : '다음 칸으로 →') : '다른 문제로 다시 도전'}</button>`);
  panel.querySelector('.go').onclick = () => { if (ok){ prog.children[at].classList.add('ok'); move(at + 1); } else ask(); };
}
function move(to){ panel.style.display = 'none'; const a = hero.position.clone(), b = pos(STEPS[to].g); b.y = .4; hop = {a, b, t: 0, to}; hero.rotation.y = Math.atan2(b.x - a.x, b.z - a.z); }
function land(to){ at = to; sHop();
  if (STEPS[at].goal){ sWin(); setTimeout(() => { document.getElementById('endTxt').innerHTML = `OX 9문제를 모두 통과했어요${wrong ? ` (다시 도전 ${wrong}번)` : ' — 한 번도 안 틀렸어요!'}.<br>AI가 나를 설명할 수 있도록 증거를 쌓는 7단계,<br>이제 진짜로 해 볼 차례예요.`;
    document.getElementById('end').style.display = 'flex'; }, 900); return; }
  setTimeout(ask, 350); }
function reset(){ at = 0; wrong = 0; used.clear(); [...prog.children].forEach(x => x.classList.remove('ok')); const p = pos(STEPS[0].g); hero.position.set(p.x, .4, p.z); hero.rotation.y = 0; }
document.getElementById('startBtn').onclick = () => { startAudio(); document.getElementById('intro').style.display = 'none'; ask(); };
document.getElementById('againBtn').onclick = () => { document.getElementById('end').style.display = 'none'; reset(); ask(); };
reset();
// 움직임·카메라
const clock = new THREE.Clock(); let walk = 0, stepDT = 1/30;
function loop(){
  const dt = window.__REC ? stepDT : Math.min(.05, clock.getDelta());
  if (hop){ hop.t = Math.min(1, hop.t + dt*(window.__REC ? 1.25 : 1.1)); const e = hop.t < .5 ? 2*hop.t*hop.t : 1 - Math.pow(-2*hop.t + 2, 2)/2;
    hero.position.lerpVectors(hop.a, hop.b, e); hero.position.y = .4 + Math.sin(Math.PI*hop.t)*1.6; walk += dt*14;
    if (hop.t >= 1){ const to = hop.to; hop = null; land(to); } } else walk *= .85;
  const sw = Math.sin(walk)*.5; l1.rotation.x = sw; l2.rotation.x = -sw; a1.rotation.x = -sw; a2.rotation.x = sw;
  tiles.forEach((t, i) => { const target = (i === at && !hop) ? .1 : .25; t.m.position.y += (target - t.m.position.y)*.2; });
  if (cert) cert.rotation.y += dt*.8;
  const want = new THREE.Vector3(hero.position.x + 8, 17, hero.position.z + 17); cam.position.lerp(want, .06); cam.lookAt(hero.position.x, 1, hero.position.z);
  R.render(S, cam); if (!window.__REC) requestAnimationFrame(loop);
}
window.__step = (dt) => { clock.getDelta(); stepDT = dt; loop(); };
cam.position.set(pos([0,0]).x + 8, 17, pos([0,0]).z + 17); loop();
addEventListener('resize', () => { cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); R.setSize(innerWidth, innerHeight); });
</script>
