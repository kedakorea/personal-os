<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>결제 시험 결과 · 브랜디움</title>
<style>body{margin:0;background:#FAFAFA;color:#242424;font-family:-apple-system,"Apple SD Gothic Neo",Pretendard,sans-serif}.w{max-width:560px;margin:0 auto;padding:40px 18px}h1{font-size:22px}pre{background:#fff;border:1px solid #e3e3e8;border-radius:12px;padding:14px;white-space:pre-wrap;font-size:13px}a{color:#D90368}</style>
</head><body><div class="w"><h1 id="h">승인 요청 중…</h1><pre id="r"></pre><p><a href="/paytest/">← 다시 시험하기</a></p></div>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const body = { action: "confirm", paymentKey: q.get("paymentKey"), orderId: q.get("orderId"), amount: Number(q.get("amount")) };
  const r = await fetch("https://ergkmihtllkpuiaevvcv.supabase.co/functions/v1/pay", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  document.getElementById("h").textContent = j.ok ? "✅ 결제 승인 완료 (시험)" : "❌ 승인 실패";
  document.getElementById("r").textContent = JSON.stringify(j, null, 2);
})();
</script></body></html>
