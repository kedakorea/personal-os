<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>퍼스널 OS — 사무실 화면 미리보기</title><link rel="icon" href="../../favicon.png">
<style>
:root{--ink:#432f2e;--paper:#fff8e6}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;word-break:keep-all}
header{max-width:1200px;margin:0 auto;padding:26px 20px 6px}header .lab{font-size:12px;font-weight:800;letter-spacing:.12em;opacity:.6}h1{margin:6px 0 4px;font-size:clamp(22px,3vw,30px)}header p{margin:0;font-size:14.5px;opacity:.75;line-height:1.6}
.tabs{max-width:1200px;margin:16px auto 0;padding:0 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.tabs .g{font-size:12.5px;font-weight:800;opacity:.55;margin:0 2px 0 8px}.tabs .g:first-child{margin-left:0}
.tabs button{font:inherit;font-size:14px;font-weight:700;padding:8px 14px;border-radius:99px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}.tabs button.on{background:var(--ink);color:#fff8e6}
.view{max-width:1200px;margin:14px auto 40px;padding:0 20px}.frame{background:#fff;border:2px solid var(--ink);border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(67,47,46,.12)}.frame .bar{display:flex;gap:6px;align-items:center;padding:9px 12px;border-bottom:1px solid #eee;background:#fafafa}.frame .bar i{width:11px;height:11px;border-radius:50%;background:#e0e0e0}.frame .bar span{margin-left:8px;font-size:12.5px;opacity:.6}
.frame img{display:block;width:100%;height:auto}.desc{margin-top:12px;font-size:15px;line-height:1.7}.desc b{font-size:17px}
.note{margin-top:8px;font-size:13px;opacity:.6;line-height:1.6}
</style></head><body>
<header><div class="lab">PERSONAL OS · 사무실 화면</div><h1>퍼스널 OS 앱을 열면 보이는 화면</h1><p>실제 앱 화면을 그대로 찍은 것입니다. 할 일·달력·대화는 대표님 것으로 채워지고, 회사·매니저·부서 이름도 대표님 것으로 바뀝니다.</p></header>
<div class="tabs" id="tabs"></div>
<div class="view"><div class="frame"><div class="bar"><i></i><i></i><i></i><span id="nm"></span></div><img id="im" alt=""></div><div class="desc" id="ds"></div>
<p class="note">※ 예시 회사 '브라이트랩', 매니저 '하나', 부서 6개 기준 · 홍보팀이 일하는 중인 장면입니다. 설치 뒤에도 매니저에게 "화면 바꿔 줘"라고 하면 언제든 바꿀 수 있어요.</p></div>
<script>
const S=[["캐릭터형",[["hq","본사형","도트 사무실에 부서 직원들이 앉아 일해요. 일하는 부서는 '작업 중' 말풍선이 뜨고, 실장실의 매니저가 진행 상황을 알려 줘요."],["village","동물의숲형","마을에 부서별 집과 동물 직원이 살아요. 일을 맡은 직원은 오피스로 출근하고, 밤에는 집에서 자요."],["cyworld","싸이월드형","미니홈피 그대로 — 미니룸에 부서 직원들, 방명록에는 부서 소식이 올라와요."]]],["심플형",[["minimal","미니멀형","가운데 대화창을 크게, 왼쪽엔 할 일만. 가장 단순한 화면이에요."],["diary","다이어리형","플래너처럼 — 줄 노트 할 일, 손글씨 월간 달력에 실제 일정, 메모 포스트잇, 출근 체크."],["magazine","매거진형","잡지 표지처럼 — 오늘의 헤드라인, 할 일 칼럼, 부서별 기사로 진행 상황을 보여 줘요."]]]];
const all=S.flatMap(([g,l])=>l);const tabs=document.getElementById("tabs");
tabs.innerHTML=S.map(([g,l])=>`<span class="g">${g}</span>`+l.map(([k,n])=>`<button data-k="${k}">${n}</button>`).join("")).join("");
function show(k){const x=all.find(a=>a[0]===k)||all[0];document.getElementById("im").src=x[0]+"_big.jpg";document.getElementById("nm").textContent=x[1];document.getElementById("ds").innerHTML=`<b>${x[1]}</b><br>${x[2]}`;tabs.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.k===x[0]));history.replaceState(null,"","#"+x[0]);}
tabs.onclick=e=>{const b=e.target.closest("button");if(b)show(b.dataset.k)};show(location.hash.slice(1)||"hq");
</script></body></html>
