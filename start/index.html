<style>
:root{--ink:#432f2e;--cream:#feefb8;--paper:#fff8e6;--sand:#ead9c6;--blue:#c4dae8;--butter:#ffd84d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:Pretendard,-apple-system,sans-serif;word-break:keep-all;-webkit-font-smoothing:antialiased;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 22px;position:sticky;top:0;background:var(--paper);z-index:5}
header .logo img{height:22px;display:block}
header .home{font-size:13px;font-weight:700;color:var(--ink);text-decoration:none;border:1.5px solid var(--ink);border-radius:99px;padding:6px 12px;white-space:nowrap}
.keyin{font:800 22px/1.4 "Josefin Sans",Pretendard!important;letter-spacing:.12em;text-transform:uppercase;text-align:center}
header b{font:700 17px 'Josefin Sans',Pretendard;letter-spacing:.04em}
header span{font-size:13px;opacity:.6}
.bar{height:6px;background:var(--sand);margin:0 22px;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .35s}
main{max-width:720px;margin:0 auto;padding:34px 22px 150px}
.lab{font:700 13px 'Josefin Sans',Pretendard;letter-spacing:.16em;opacity:.55}
h1{font-size:clamp(28px,6vw,40px);line-height:1.3;margin:10px 0 12px;font-weight:900}
.sub{font-size:17px;line-height:1.7;opacity:.8}
.q{margin-top:30px}
.q>label,.q>.t{display:block;font-size:19px;font-weight:800;margin-bottom:10px}
.q small{display:block;font-size:14px;opacity:.6;margin:-4px 0 10px;font-weight:500}
input[type=text],input[type=tel],textarea{width:100%;font:17px/1.6 Pretendard;padding:14px 16px;border:2px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink)}
textarea{min-height:130px;resize:vertical}
input:focus,textarea:focus{outline:3px solid var(--butter)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cards button{font:600 16px/1.4 Pretendard;text-align:left;padding:14px 14px;border:2px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);cursor:pointer;min-height:58px}
.cards button em{display:block;font-style:normal;font-size:22px;margin-bottom:4px}
.cards.mini{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.cards.mini button{min-height:44px;font-size:15px;padding:10px 12px}.cards.mini button em{display:inline;font-size:16px;margin:0 4px 0 0}
.cards button.on{background:var(--ink);color:var(--cream)}
.cards.one button.on{background:var(--butter);color:var(--ink)}
.memo{margin-top:28px;border-top:2px dashed var(--sand);padding-top:18px;display:none}
body.iv .memo{display:block}
.memo label{font-size:15px;font-weight:800;opacity:.75}
.memo textarea{min-height:80px;background:#fffdf3;border-style:dashed}
nav{position:fixed;z-index:6;left:0;right:0;bottom:0;background:var(--paper);border-top:2px solid var(--sand);padding:14px 22px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
nav button{font:800 17px Pretendard;padding:15px 26px;border-radius:99px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
nav button.go{background:var(--ink);color:var(--cream);flex:1;max-width:420px}
nav button:disabled{opacity:.35}
.mode{display:grid;gap:14px;margin-top:28px}
.mode button{text-align:left;font:17px/1.6 Pretendard;padding:22px 22px;border:3px solid var(--ink);border-radius:20px;background:#fff;color:var(--ink);cursor:pointer;box-shadow:5px 5px 0 var(--ink)}
.mode button b{display:block;font-size:22px;margin-bottom:4px}
.sum{background:#fff;border:2px solid var(--ink);border-radius:18px;padding:20px 22px;margin-top:24px;font-size:15.5px;line-height:1.75;white-space:pre-wrap}
.note{font-size:14px;opacity:.65;margin-top:14px;line-height:1.6}
.saved{font-size:12px;opacity:.55;flex:1;text-align:right}
html,body{overflow-x:hidden}
.cards button{min-width:0;overflow-wrap:anywhere}
@media(max-width:480px){header .who{display:none}.cards{grid-template-columns:1fr 1fr}nav button{padding:14px 18px}}
.done{text-align:center;padding-top:60px}
.done .big{font-size:64px}

/* AI 인터뷰 · 제안서 */
#chat{display:flex;flex-direction:column;gap:12px}
.m{max-width:88%;padding:14px 18px;border-radius:20px;font-size:17px;line-height:1.7;white-space:pre-wrap}
.m.ai{align-self:flex-start;background:#fff;border:2px solid var(--ink);border-radius:20px 20px 20px 6px}
.m.me{align-self:flex-end;background:var(--ink);color:var(--cream);border-radius:20px 20px 6px 20px}
.m .f{display:block;font-size:13px;opacity:.7;margin-top:6px}.m.wait{opacity:.6;font-style:italic}
.dock{position:fixed;z-index:6;left:0;right:0;bottom:0;background:var(--paper);border-top:2px solid var(--sand);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.dock .hint{font-size:13px;opacity:.6;margin:0 4px 6px;max-width:720px;margin-inline:auto}
.dock .in{display:flex;gap:8px;align-items:flex-end;max-width:720px;margin:0 auto}
.dock textarea{min-height:54px;max-height:160px;resize:none}
.clip{font-size:22px;background:#fff;border:2px solid var(--ink);border-radius:14px;width:50px;height:54px;cursor:pointer;flex:none}
.sendb,.bigb{font:800 17px Pretendard;padding:0 20px;height:54px;border-radius:99px;border:2px solid var(--ink);background:var(--ink);color:var(--cream);cursor:pointer;flex:none}
.bigb{display:block;width:100%;max-width:720px;margin:10px auto 0;background:var(--butter);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;max-width:720px;margin:0 auto 6px}.chips span{font-size:13px;background:#fff;border:1px solid var(--sand);border-radius:99px;padding:4px 10px}
.busy{padding:50px 0;text-align:center;font-size:18px;line-height:1.8}.busy .dot{font-size:46px;display:block;animation:bb 1.2s infinite}@keyframes bb{50%{transform:translateY(-8px)}}
.names{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}.names button{font:700 18px Pretendard;padding:12px 18px;border:2px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);cursor:pointer}.names button.on{background:var(--ink);color:var(--cream)}
.aslot{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:14px 16px;margin-top:10px}.aslot b{font-size:17px}.aslot small{display:block;font-size:13px;opacity:.65;margin-top:2px}.af{display:inline-block;font-size:13px;background:var(--cream);border-radius:99px;padding:3px 10px;margin:6px 6px 0 0}.af a{color:inherit;text-decoration:none;margin-left:4px}.asb{display:inline-flex;align-items:center;background:var(--butter)!important;color:var(--ink)!important;height:44px!important;font-size:15px!important;cursor:pointer}
.okbox{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:22px;margin-top:18px;font-size:17px;line-height:1.8}

<!-- 🎤 칸마다 받아쓰기 (2026-10-18 보완) — 버튼 누른 칸에 PC 마이크 음성을 이어 적는다. 받아쓰는 중에도 앞부분을 바로 고칠 수 있다 -->
<style>
.fw{position:relative}.fw textarea,.fw input{padding-right:58px}
.fmic{position:absolute;right:8px;top:8px;width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:19px;cursor:pointer;z-index:1;line-height:1}
.fmic.on{background:#ff5a5f;border-color:#ff5a5f;animation:micp 1.2s infinite}
@keyframes micp{50%{box-shadow:0 0 0 8px rgba(255,90,95,.25)}}
.dock .fw{flex:1}.micnow{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:80;max-width:min(560px,92vw);background:#242424;color:#fff;border-radius:14px;padding:8px 14px;font:15px/1.5 Pretendard;display:none}
.micT{outline:3px solid #ff5a5f!important}
</style>
<div class="micnow" id="micnow"></div>
<script>
(function(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition, now = document.getElementById("micnow");
  let rec = null, target = null, btnOn = null, on = false;
  function put(txt) {
    if (!target || !document.body.contains(target)) return;
    const focused = document.activeElement === target, a = target.selectionStart, b = target.selectionEnd, v = target.value;
    target.value = v + (v && !/\s$/.test(v) ? " " : "") + txt.trim();
    if (focused) target.setSelectionRange(a, b); else target.scrollTop = target.scrollHeight;   // 고치는 중인 커서는 그대로
    target.dispatchEvent(new Event("input", { bubbles: true }));
  }
  function stop() { on = false; if (btnOn) { btnOn.classList.remove("on"); btnOn.textContent = "🎤"; } if (target) target.classList.remove("micT"); now.style.display = "none"; try { rec && rec.stop(); } catch (x) {} btnOn = null; }
  function start(el, btn) {
    if (!SR) { alert("받아쓰기는 크롬에서 됩니다. 크롬으로 열어 주세요."); return; }
    if (on) stop();
    target = el; btnOn = btn; on = true; btn.classList.add("on"); btn.textContent = "⏹"; el.classList.add("micT");
    rec = new SR(); rec.lang = "ko-KR"; rec.continuous = true; rec.interimResults = true;
    rec.onresult = (e) => { let it = ""; for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) put(r[0].transcript); else it += r[0].transcript; } now.style.display = it ? "block" : "none"; now.textContent = "🎧 " + it; };
    rec.onerror = (e) => { if (e.error === "not-allowed") { alert("마이크를 허용해 주세요 (주소창 왼쪽 → 마이크 허용)"); stop(); } };
    rec.onend = () => { if (on) { try { rec.start(); } catch (x) {} } };
    rec.start();
  }
  function deco() {
    document.querySelectorAll("textarea, input[type=text]").forEach((el) => {
      if (el.dataset.mic || el.id === "keyin" || el.closest(".fw")) return;
      el.dataset.mic = "1";
      const w = document.createElement("div"); w.className = "fw"; el.parentNode.insertBefore(w, el); w.appendChild(el);
      const b = document.createElement("button"); b.type = "button"; b.className = "fmic"; b.textContent = "🎤"; b.title = "이 칸에 말로 적기 (다시 누르면 멈춤)";

})();
</script>
