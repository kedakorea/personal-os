<style>
:root{--ink:#432f2e;--cream:#feefb8;--paper:#fff8e6;--sand:#ead9c6;--blue:#c4dae8;--butter:#ffd84d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:Pretendard,-apple-system,sans-serif;word-break:keep-all;-webkit-font-smoothing:antialiased;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 22px;position:sticky;top:0;background:var(--paper);z-index:5}
header b{font:700 17px 'Josefin Sans',Pretendard;letter-spacing:.04em}
header span{font-size:13px;opacity:.6}
.bar{height:6px;background:var(--sand);margin:0 22px;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .35s}
main{max-width:720px;margin:0 auto;padding:34px 22px 150px}
.lab{font:700 13px 'Josefin Sans',Pretendard;letter-spacing:.16em;opacity:.55}
h1{font-size:clamp(28px,6vw,40px);line-height:1.3;margin:10px 0 12px;font-weight:900}
.sub{font-size:17px;line-height:1.7;opacity:.8}
.q{margin-top:30px}
.q>label,.q>.t{display:block;font-size:19px;font-weight:800;margin-bottom:10px}
.q small{display:block;font-size:14px;opacity:.6;margin:-4px 0 10px;font-weight:500}
input[type=text],input[type=tel],textarea{width:100%;font:17px/1.6 Pretendard;padding:14px 16px;border:2px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink)}
textarea{min-height:130px;resize:vertical}
input:focus,textarea:focus{outline:3px solid var(--butter)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cards button{font:600 16px/1.4 Pretendard;text-align:left;padding:14px 14px;border:2px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);cursor:pointer;min-height:58px}
.cards button em{display:block;font-style:normal;font-size:22px;margin-bottom:4px}
.cards button.on{background:var(--ink);color:var(--cream)}
.cards.one button.on{background:var(--butter);color:var(--ink)}
.memo{margin-top:28px;border-top:2px dashed var(--sand);padding-top:18px;display:none}
body.iv .memo{display:block}
.memo label{font-size:15px;font-weight:800;opacity:.75}
.memo textarea{min-height:80px;background:#fffdf3;border-style:dashed}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:2px solid var(--sand);padding:14px 22px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
nav button{font:800 17px Pretendard;padding:15px 26px;border-radius:99px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
nav button.go{background:var(--ink);color:var(--cream);flex:1;max-width:420px}
nav button:disabled{opacity:.35}
.mode{display:grid;gap:14px;margin-top:28px}
.mode button{text-align:left;font:17px/1.6 Pretendard;padding:22px 22px;border:3px solid var(--ink);border-radius:20px;background:#fff;color:var(--ink);cursor:pointer;box-shadow:5px 5px 0 var(--ink)}
.mode button b{display:block;font-size:22px;margin-bottom:4px}
.sum{background:#fff;border:2px solid var(--ink);border-radius:18px;padding:20px 22px;margin-top:24px;font-size:15.5px;line-height:1.75;white-space:pre-wrap}
.note{font-size:14px;opacity:.65;margin-top:14px;line-height:1.6}
.saved{font-size:12px;opacity:.55;flex:1;text-align:right}
html,body{overflow-x:hidden}
.cards button{min-width:0;overflow-wrap:anywhere}
@media(max-width:480px){header .who{display:none}.cards{grid-template-columns:1fr 1fr}nav button{padding:14px 18px}}
.done{text-align:center;padding-top:60px}
.done .big{font-size:64px}
</style></head><body>

const KEY = "pos_intake_v1";
let S = JSON.parse(localStorage.getItem(KEY) || "{}");
S.a = S.a || {}; S.memo = S.memo || {}; S.step = S.step || 0;
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function save() { S.t = new Date().toISOString(); localStorage.setItem(KEY, JSON.stringify(S)); $("saved").textContent = "자동 저장됨"; }
if (new URLSearchParams(location.search).get("mode") === "interview" && !S.mode) S.mode = "interview";

function opts(q) { if (q.from) return (S.a[q.from] || []).map((x) => WORK.find((w) => w[1] === x) || ["•", x]); return q.opts; }
function field(q) {
  const v = S.a[q.k];

  if (q.type === "area") return `<div class="q">${head}<textarea data-k="${q.k}" style="${q.big ? "min-height:260px" : ""}">${esc(v || "")}</textarea></div>`;

function render() {

  const m = Object.entries(S.memo || {}).filter(([, v]) => v).map(([k, v]) => `  (${STEPS[k] && STEPS[k].lab}) ${v}`);

document.addEventListener("input", (e) => {

  if (k) S.a[k] = e.target.value; else if (m !== undefined) S.memo[m] = e.target.value; else return;

  const md = e.target.closest("[data-mode]");
  if (md) { S.mode = md.dataset.mode; document.body.classList.toggle("iv", S.mode === "interview"); S.step = Math.max(1, S.step === 0 ? 1 : S.step); save(); render(); return; }
  if (e.target.id === "reset" || e.target.id === "again") { e.preventDefault(); if (confirm("작성한 내용을 지우고 처음부터 할까요?")) { S = { a: {}, memo: {}, step: 0 }; save(); render(); } return; }
  const b = e.target.closest(".cards button");
  if (b) {
    const k = b.dataset.k, v = b.dataset.v, multi = b.parentElement.dataset.multi === "1";
    if (multi) { const arr = S.a[k] || []; S.a[k] = arr.includes(v) ? arr.filter((x) => x !== v) : arr.concat(v); b.classList.toggle("on"); }
    else { S.a[k] = v; b.parentElement.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); }
    save();
  }
});
$("back").onclick = () => { if (S.step > 1) { S.step--; save(); render(); } };
$("next").onclick = async () => {
  const st = STEPS[S.step];
  if (st.lab && st.lab.startsWith("01") && !(S.a.name || "").trim()) { alert("성함을 적어 주세요."); return; }
  if (st.id === "review") {
    $("next").disabled = true; $("next").textContent = "보내는 중…";
    const p = new URLSearchParams();
    p.append(FORM.e.mode, S.mode === "interview" ? "인터뷰" : "직접 작성");
    p.append(FORM.e.name, S.a.name || ""); p.append(FORM.e.co, S.a.co || ""); p.append(FORM.e.tel, S.a.tel || "");
    p.append(FORM.e.sum, summary()); p.append(FORM.e.json, JSON.stringify({ v: 1, mode: S.mode, a: S.a, memo: S.memo, t: S.t }));
    try { await fetch(FORM.action, { method: "POST", mode: "no-cors", body: p }); S.sent = new Date().toISOString(); }
    catch (err) { alert("인터넷 연결을 확인하고 다시 눌러 주세요. 작성한 내용은 저장돼 있습니다."); $("next").disabled = false; render(); return; }
    $("next").disabled = false;
  }
  S.step = Math.min(STEPS.length - 1, S.step + 1); save(); render();
};
render();
</script>
</body></html>
