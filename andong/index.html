<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>워크숍 명단 체크</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>*{box-sizing:border-box;margin:0}body{font-family:Pretendard,-apple-system,sans-serif;color:#1d3270;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(100deg,#d6ebfb,#eef4fb 55%,#fbe9d6)}
form{width:100%;max-width:360px;background:#fff;border-radius:22px;padding:28px 22px;text-align:center;box-shadow:0 6px 18px rgba(29,50,112,.1)}h1{font:900 24px/1.3 Pretendard}p{font:600 15px/1.5 Pretendard;color:#6a74a0;margin:6px 0 18px}
input{width:100%;border:2px solid #c2cbe0;border-radius:14px;padding:14px;font:800 28px Pretendard;text-align:center;letter-spacing:6px;color:inherit}button{width:100%;margin-top:10px;border:0;border-radius:14px;background:#2f7fe6;color:#fff;padding:15px;font:800 18px Pretendard}#e{min-height:20px;margin-top:10px;font:700 14px Pretendard;color:#c8322b}</style></head><body>
<form id="f"><h1>워크숍 명단 체크</h1><p>비밀번호 6자리를 넣어 주세요</p><input id="p" inputmode="numeric" maxlength="6" autocomplete="off" autofocus><button id="b">들어가기</button><div id="e"></div></form>
<script src="../os.js"></script>
<script>
/* 쉬운 입구 (2026-11-08) — 비밀번호를 체크판 코드로 바꿔 /check 로 보낸다. 페이지에 명단·코드 없음 */
const go = (k) => location.replace("../check/?k=" + encodeURIComponent(k));
const saved = localStorage.getItem("trip_k"); if (saved) go(saved);
document.getElementById("f").onsubmit = async (ev) => { ev.preventDefault(); const e = document.getElementById("e"), b = document.getElementById("b"); e.textContent = ""; b.disabled = true;
  try { const r = await fetch(OS_URL + "/rest/v1/rpc/trip_open", { method: "POST", headers: { "Content-Type": "application/json", apikey: OS_ANON, Authorization: "Bearer " + OS_ANON }, body: JSON.stringify({ p_pin: document.getElementById("p").value.trim() }) });
    const k = await r.json(); if (k && r.ok) { localStorage.setItem("trip_k", k); return go(k); } e.textContent = "비밀번호를 다시 확인해 주세요"; } catch (x) { e.textContent = "인터넷 연결을 확인해 주세요"; }
  b.disabled = false; };
</script></body></html>
