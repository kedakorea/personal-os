    const w = TossPayments(TOSS_GCK).widgets({ customerKey: u.id });

    const b = $("#payb"); b.disabled = false;
    const no = String(o.order_no).replace(/[^A-Za-z0-9_-]/g, "");
    const back = location.origin + "/class/order/?no=" + encodeURIComponent(o.order_no);

        successUrl: back + "&paid=ok", failUrl: back + "&paid=fail" }); }
      catch (e) { $(".err").textContent = e.message || String(e); }
    };
  } catch (e) { $(".err").textContent = "결제창을 열지 못했습니다: " + (e.message || e); }
}

  const OPT = () => [...M.querySelectorAll("input[name=o]:checked")].map((x) => x.value).join(",");

    if (!v("nm")) return err("이름을 적어 주세요.");
    if (!/^01\d{8,9}$/.test(v("ph").replace(/[^0-9]/g, ""))) return err("휴대폰 번호를 확인해 주세요.");
    if (OPT() && !v("evd")) return err("할인 대상 확인용 정보를 적어 주세요.");
    const CARD = PM() === "card";
    if (!CARD && !v("dp")) return err("입금자명을 적어 주세요.");
    const TAX = !CARD && v("rt") === "세금계산서", BF = ($("#bc").files || [])[0];
    if (!CARD && v("rt") && !TAX && !v("rn")) return err("증빙에 쓸 번호를 적어 주세요.");
    if (TAX && !v("tbn") && !BF) return err("사업자등록번호를 적거나 사업자등록증을 올려 주세요.");
    if (TAX && v("tbn") && !/^\d{3}-?\d{2}-?\d{5}$/.test(v("tbn"))) return err("사업자등록번호를 확인해 주세요. (예: 123-45-67890)");
    if (TAX && !/^\S+@\S+\.\S+$/.test(v("te"))) return err("세금계산서 받을 이메일을 적어 주세요.");
    if (TAX && BF && BF.size > 10 * 1024 * 1024) return err("사업자등록증 파일은 10MB 이하로 올려 주세요.");
    if (!$("#ag").checked) return err("결제 동의에 체크해 주세요.");
    $("#go").disabled = true;
    let BC = null;
    if (TAX && BF) {
      const ext = (BF.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "");
      BC = `taxcert/${u.id}/${Date.now()}.${ext}`;
      const up = await sb.storage.from("uploads").upload(BC, BF, { contentType: BF.type || undefined });
      if (up.error) { $("#go").disabled = false; return err("사업자등록증을 올리지 못했습니다. (" + up.error.message + ")"); }
    }
    const OL = { grad: "퍼스널브랜드대학 졸업생", mju: "명지대 교육대학원생", os: "퍼스널 OS 설치 고객" };
    const memo = [OPT() ? `[할인 대상] ${OPT().split(",").map((k) => OL[k]).join(" · ")} — ${v("evd")}` : "", v("mo")].filter(Boolean).join("\n") || null;
    const { data, error } = await sb.from("orders").insert({ product: PROD, opt: OPT() || null, member_id: u.id, price: 0, name: v("nm"), phone: v("ph"), email: v("em") || null,
      tax_email: TAX ? v("te") : null, biz_cert: BC, depositor: CARD ? null : v("dp"), receipt_type: CARD ? null : (v("rt") || null), receipt_no: CARD ? null : (TAX ? (v("tbn") || null) : (v("rn") || null)),
      pay_method: CARD ? "카드(토스)" : "계좌입금", memo, agree_at: new Date().toISOString() }).select().single();
    $("#go").disabled = false;
    if (error) return err("주문을 저장하지 못했습니다: " + error.message);
    if (CARD) return showPay(u, data);
    done(data);
  };
}
function done(o) {
  window.scrollTo(0, 0);
  M.innerHTML = `<p class="en">THANK YOU</p><h1>수강 신청이 접수되었습니다</h1><p class="sub">주문번호 <b>${osEsc(o.order_no)}</b> · ${osEsc(o.product)}</p>${KCH}
  <div class="bank">입금하실 금액 <b>${won(o.price)}</b> <small>(VAT 포함)</small><br>기업은행 <b>114-193627-04-019</b><br>예금주 (주)캐다<br>입금자명 ${osEsc(o.depositor || "")}</div>
  <p class="small">· <b>24시간 안에</b> 입금해 주세요. 입금이 확인되면 내 강의실이 열리고 안내를 드립니다.<br>· 문의 010-8225-6242 · <a href="https://pf.kakao.com/_gMxogd" target="_blank" rel="noopener">카카오톡 채널</a></p>
  <a class="btn dark" href="../../account/" style="margin-top:20px">마이페이지에서 주문 보기</a>`;
}
(async () => {
  const q = new URLSearchParams(location.search);
  if (q.get("paid")) {
    window.scrollTo(0, 0);
    const fail = (msg) => M.innerHTML = `<p class="en">PAYMENT</p><h1>결제가 완료되지 않았습니다</h1><p class="sub">${osEsc(msg)}</p><p class="small">주문은 <b>입금대기</b>로 남아 있습니다. 24시간 안에 계좌(기업은행 114-193627-04-019 (주)캐다)로 입금하시거나, 처음부터 다시 신청해 주세요. 문의 010-8225-6242</p><a class="btn dark" href="./">다시 신청하기</a>`;
    if (q.get("paid") !== "ok") { fail(q.get("message") || "결제를 취소하셨거나 오류가 났습니다."); return; }
    M.innerHTML = `<p class="en">PAYMENT</p><h1>결제를 확인하고 있습니다…</h1><p class="sub">창을 닫지 말고 잠시만 기다려 주세요.</p>`;
    try {
      const r = await fetch(OS_URL + "/functions/v1/pay", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "confirm", paymentKey: q.get("paymentKey"), orderId: q.get("orderId"), amount: q.get("amount"), no: q.get("no") }) });
      const j = await r.json();
      if (!j.ok) { fail(j.error || "결제 승인에 실패했습니다."); return; }
      M.innerHTML = `<p class="en">THANK YOU</p><h1>결제가 완료되었습니다</h1><p class="sub">주문번호 <b>${osEsc(q.get("no") || "")}</b>${j.totalAmount ? ` · ${won(j.totalAmount)}` : ""}<br>수강 등록이 완료되었어요. 강의실은 <b>11/20(금) 0시</b>에 열리고, 강의는 순차 공개됩니다.</p><a class="btn dark" href="../room/">🎓 내 강의실 들어가기</a>${KCH}${j.receipt ? `<p class="small"><a href="${osEsc(j.receipt)}" target="_blank" rel="noopener">카드 영수증 보기</a></p>` : ""}`;
    } catch (e) { fail("결제 확인 중 오류가 났습니다. 문의 주시면 바로 확인해 드립니다."); }
    return;
  }
  const { data } = await sb.auth.getSession();
  if (!data.session) return needLogin();
  const u = data.session.user;
  const { data: m } = await sb.from("members").select("*").eq("id", u.id).maybeSingle();
  if (!m || !m.agree_terms_at) return needLogin();
  form(u, m);
})();
</script>
