<style>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
// 2026-11-16 자격과정 강의실 — 기수 명단(class_enroll)에 있는 회원만, 10초 구간 단위로 본 곳을 저장
const sb = supabase.createClient(OS_URL, OS_ANON), M = document.getElementById("m");
const COHORT = new URLSearchParams(location.search).get("c") || "cert2-1";
const COHORT_NAME = {"cert2-1": "AI 퍼스널 브랜딩 전문가 2급 · 1기"}[COHORT] || COHORT;
let U = null, L = [], P = {}, cur = null, player = null, seen = new Set(), dirty = false, timer = null;
const pctOf = (p) => p ? Math.min(100, p.percent || 0) : 0;
function needLogin() {
  sessionStorage.setItem("after_login", location.href);
  M.innerHTML = `<p class="en">CLASS</p><h1>${COHORT_NAME}<br>강의실</h1><p class="sub">수강생 전용 강의실입니다. 브랜디움에 로그인해 주세요.</p><a class="btn dark" href="../account/">로그인하고 강의실 들어가기</a>`;
}
function draw() {
  const done = L.filter((l) => P[l.id] && P[l.id].completed).length;
  M.innerHTML = `<p class="en">CLASS</p><h1>${COHORT_NAME}<br>강의실</h1>
  <p class="sub">강의는 이 강의실에서 재생해야 수강이 인정돼요. 끝까지(90% 이상) 보시면 자동으로 완료 처리됩니다.</p>
  <div class="tot"><span>내 수강 현황</span><span>${done} / ${L.length}강 완료</span></div>
  <div id="pv"></div>
  <div class="lessons">${L.map((l) => { const p = P[l.id], pc = pctOf(p); return `<div class="ls ${cur && cur.id === l.id ? "on" : ""}" data-id="${l.id}"><span class="no">${l.no}강</span><span class="t">${osEsc(l.title)}</span><span class="bar"><i style="width:${pc}%"></i></span><span class="pct ${p && p.completed ? "done" : ""}">${p && p.completed ? "✅ 완료" : pc + "%"}</span></div>`; }).join("")}</div>`;
  M.querySelectorAll(".ls").forEach((d) => d.onclick = () => open(L.find((l) => l.id == d.dataset.id)));
  if (cur) mountPlayer();
}
function mountPlayer() {
  const pv = document.getElementById("pv");
  pv.innerHTML = `<p class="ptitle">${cur.no}강 · ${osEsc(cur.title)}</p><div class="player"><div id="yt"></div></div>
   <div class="tools">${cur.pdf_path ? '<button class="btn dark" id="pdf">📄 교안 PDF 받기</button>' : '<span class="small">📄 교안 PDF는 준비되면 여기에서 받으실 수 있어요</span>'}</div>`;
  const start = (P[cur.id] && P[cur.id].last_pos) || 0;
  player = new YT.Player("yt", { videoId: cur.youtube_id, playerVars: { rel: 0, modestbranding: 1, start, playsinline: 1 },
    events: { onStateChange: (e) => { if (e.data === 1) tick(); else { save(); } } } });
  const b = document.getElementById("pdf");
  if (b) b.onclick = async () => { const { data, error } = await sb.storage.from("uploads").createSignedUrl(cur.pdf_path, 300); if (error) return alert("교안을 열지 못했습니다."); window.open(data.signedUrl, "_blank"); };
}
function open(l) {
  save(); cur = l; seen = new Set(((P[l.id] || {}).watched) || []); draw(); window.scrollTo({ top: 0, behavior: "smooth" });
}
function tick() {
  clearInterval(timer);
  timer = setInterval(() => {
    if (!player || !player.getCurrentTime || player.getPlayerState() !== 1) return;
    const t = player.getCurrentTime(); seen.add(Math.floor(t / 10)); dirty = true;
  }, 1000);
}
setInterval(() => save(), 30000);
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
window.addEventListener("pagehide", () => save());
async function save() {
  if (!cur || !dirty || !player || !player.getDuration) return;
  dirty = false;
  const dur = Math.round(player.getDuration() || 0); if (!dur) return;
  const total = Math.ceil(dur / 10), pc = Math.min(100, Math.round(seen.size / total * 100));
  const prev = P[cur.id] || {};
  const row = { member_id: U.id, lesson_id: cur.id, watched: [...seen], duration: dur, percent: Math.max(pc, prev.manual ? prev.percent : 0),
    completed: prev.completed || pc >= 90, last_pos: Math.floor(player.getCurrentTime() || 0), updated_at: new Date().toISOString() };
  const { error } = await sb.from("class_progress").upsert(row);
  if (!error) { P[cur.id] = { ...prev, ...row }; const d = M.querySelector(`.ls[data-id="${cur.id}"]`);
    if (d) { d.querySelector(".bar i").style.width = pctOf(P[cur.id]) + "%"; const s = d.querySelector(".pct"); s.textContent = P[cur.id].completed ? "✅ 완료" : pctOf(P[cur.id]) + "%"; s.classList.toggle("done", !!P[cur.id].completed); }
    const done = L.filter((l) => P[l.id] && P[l.id].completed).length; const tt = M.querySelector(".tot span:last-child"); if (tt) tt.textContent = `${done} / ${L.length}강 완료`; }
}
(async () => {
  const { data } = await sb.auth.getSession();
  if (!data.session) return needLogin();
  U = data.session.user;
  const { data: en } = await sb.from("class_enroll").select("cohort").eq("member_id", U.id).eq("cohort", COHORT).maybeSingle();
  if (!en) { M.innerHTML = `<p class="en">CLASS</p><h1>${COHORT_NAME}<br>수강생 전용 강의실</h1><p class="sub">이 강의실은 ${COHORT_NAME} 수강생만 들어오실 수 있어요.<br>수강 신청을 하셨는데 이 화면이 보이면 담당자에게 알려 주세요.</p><a class="btn ghost" href="https://pf.kakao.com/_gMxogd/chat" target="_blank">카카오톡으로 문의하기</a>`; return; }
  const { data: ls } = await sb.from("class_lessons").select("*").eq("cohort", COHORT).order("no");
  L = ls || [];
  const { data: ps } = await sb.from("class_progress").select("*").in("lesson_id", L.map((l) => l.id).concat([0]));
  (ps || []).forEach((p) => P[p.lesson_id] = p);
  if (!L.length) { M.innerHTML = `<p class="en">CLASS</p><h1>${COHORT_NAME}<br>강의실</h1><p class="sub">아직 열린 강의가 없어요. 첫 강의가 열리면 알려 드릴게요.</p>`; return; }
  cur = L.find((l) => !(P[l.id] && P[l.id].completed)) || L[0]; seen = new Set(((P[cur.id] || {}).watched) || []);
  const go = () => draw();
  if (window.YT && YT.Player) go(); else window.onYouTubeIframeAPIReady = go;
})();
</script></body></html>
