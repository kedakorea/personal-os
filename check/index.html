<style>

.ov{position:fixed;inset:0;background:rgba(20,30,70,.45);z-index:9;display:flex;align-items:flex-end;justify-content:center}.sh{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 14px 26px;max-height:82vh;overflow:auto}

.pg{margin-bottom:7px}.pg summary{list-style:none;display:flex;align-items:center;gap:8px;background:#eaf0fb;border-radius:12px;padding:14px;font:800 17px Pretendard;cursor:pointer}.pg summary::-webkit-details-marker{display:none}.pg summary em{margin-left:auto;font:700 13px Pretendard;font-style:normal;color:#6a74a0}.pg summary:after{content:"▾";color:var(--c);transition:transform .15s}.pg[open] summary{margin-bottom:6px}.pg[open] summary:after{transform:rotate(180deg)}
.sh.wide{max-height:90vh}.tb{overflow:auto;max-height:64vh;border:1px solid #e4eaf5;border-radius:10px}.tb table{border-collapse:separate;border-spacing:0;font:600 13px Pretendard;white-space:nowrap;width:100%}.tb th{position:sticky;top:0;background:#1d3270;color:#fff;font:800 12px Pretendard;padding:8px;z-index:2;text-align:left}.tb td{padding:8px;border-bottom:1px solid #e4eaf5}.tb td:first-child,.tb th:first-child{position:sticky;left:0;background:#fff;z-index:1;font-weight:800}.tb th:first-child{background:#1d3270;z-index:3}.tb a{color:#2f7fe6;text-decoration:none;font-weight:700}.tb .nt{color:#c8322b;font-weight:800}.srch{width:100%;border:1.5px solid #c2cbe0;border-radius:10px;padding:10px;font:600 16px Pretendard;margin:0 0 7px}.cnt{font:700 12.5px Pretendard;color:#6a74a0;margin:0 2px 6px}
.day{background:var(--navy);color:#fff;font:900 16px Pretendard;border-radius:10px;padding:10px 12px;margin:9px 0 5px}.ti{display:flex;gap:9px;padding:9px 6px;border-bottom:1px solid #e4eaf5;align-items:baseline}.ti time{flex:none;width:92px;font:800 13px Pretendard;color:#2f7fe6}.ti b{display:block;font:800 15.5px/1.3 Pretendard}.ti span{display:block;font:600 13px/1.35 Pretendard;color:#6a74a0}.ti.now{background:#fff5d6;border-radius:9px;box-shadow:inset 3px 0 0 #f37a1f}.ti.now b:after{content:" · 지금";color:#f37a1f}
.mt{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:8px}.mt div{background:#eaf0fb;border-radius:10px;padding:7px 2px;text-align:center;font:700 11.5px/1.25 Pretendard;overflow-wrap:anywhere}.mt b{display:block;font:900 20px Pretendard;color:#2f7fe6}.mt .no b{color:#c8322b}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}.mg button{border:0;border-radius:10px;background:#eef2fa;color:var(--navy);font:800 14px/1.2 Pretendard;padding:8px 2px}.mg button small{display:block;font:700 11.5px Pretendard}.mg button.on{background:var(--navy);color:#fff}
.mj{grid-template-columns:repeat(7,1fr)}.mj button{padding:9px 0;font-size:13.5px}.ms{font:800 13px Pretendard;color:#6a74a0;margin:0 3px 6px}.mh{display:flex;justify-content:space-between;background:var(--navy);color:#fff;border-radius:10px;padding:9px 12px;font:900 15.5px Pretendard;margin-top:10px}.mh em{font:800 13px Pretendard;font-style:normal}
.mo{display:flex;align-items:center;justify-content:flex-end;gap:6px;font:800 15px Pretendard;margin:2px 3px 0}.mo input{width:20px;height:20px;accent-color:var(--c)}
.mbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}.mbar .mo{margin:0;white-space:nowrap}#msave{border:0;border-radius:10px;background:var(--navy);color:#fff;font:800 14px Pretendard;padding:9px 12px;white-space:nowrap}.mimg{display:block;width:100%;border:1px solid #e4eaf5;border-radius:10px;margin:8px 0}
.mr{padding:10px 4px;border-bottom:1px solid #e4eaf5}.mr>div:first-child{display:flex;align-items:baseline;gap:7px;margin-bottom:6px}.mr b{font:800 16.5px Pretendard}.mr small{font:600 12px Pretendard;color:#6a74a0;overflow-wrap:anywhere}.mc{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.mc button{border:1.5px solid #c2cbe0;border-radius:9px;background:#fff;color:var(--navy);font:800 13.5px/1.2 Pretendard;padding:9px 2px;overflow-wrap:anywhere}.mc button.on{background:#2f7fe6;border-color:#2f7fe6;color:#fff}.mm{width:100%;margin-top:6px;border:1.5px solid #e4eaf5;border-radius:9px;padding:8px 10px;font:600 16px Pretendard;color:var(--navy)}
.sh h2{font:900 19px Pretendard;margin:0 4px 10px}.sh h4{font:800 13px Pretendard;color:#6a74a0;margin:12px 4px 5px}
.a{width:100%;display:flex;gap:9px;align-items:center;background:#f4f7fc;border:0;border-radius:11px;padding:12px;margin-bottom:6px;font:800 16px Pretendard;color:inherit;text-align:left}.a span{flex:1}.a time{font:700 12.5px Pretendard;color:#6a74a0}.a em{font:800 13px Pretendard;font-style:normal;color:var(--c)}.a.on{outline:2px solid var(--c);background:#eaf2fe}
.nm{width:100%;background:var(--navy);color:#fff;border:0;border-radius:12px;padding:15px;font:800 18px Pretendard;margin-bottom:8px}
.add{display:flex;gap:6px;margin-top:8px}.add input{flex:1;min-width:0;border:1.5px solid #c2cbe0;border-radius:10px;padding:11px;font:600 16px Pretendard}.add button{border:0;border-radius:10px;background:var(--navy);color:#fff;padding:0 14px;font:800 15px Pretendard}
#msg{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#c8322b;color:#fff;font:800 14px Pretendard;border-radius:99px;padding:10px 16px;z-index:20;display:none;white-space:nowrap}
.e{padding:70px 24px;text-align:center;font:700 16px/1.6 Pretendard}
</style></head><body><div class="w" id="app"><p class="e">불러오는 중…</p></div><div id="ov"></div><div id="msg"></div>
<script src="../os.js"></script>
<script>
/* 행사 인원 체크판 (2026-11-08) — 명단은 페이지에 없고, 링크의 코드로 trip_get 해서 받는다 */
const CODE = new URLSearchParams(location.search).get("k") || "", $ = (i) => document.getElementById(i);
const COLOR = { 1: "#2f7fe6", 2: "#f37a1f", 3: "#16a394", A: "#2f7fe6", B: "#f37a1f", room: "#4a5bb5" }, STAFF = ["최유정", "이미나", "김윤근"];
let D = null, AC = localStorage.getItem("trip_ac") || "", VIEW = localStorage.getItem("trip_view") || "bus", SEL = JSON.parse(localStorage.getItem("trip_sel") || '{"bus":"1","ban":"A","room":"all"}'), ONLY = false, WHO = localStorage.getItem("trip_who") || "", C = {}, M = {}, MG = localStorage.getItem("trip_mban") || "A", MT = "all", MN = false, busy = 0;
const rpc = async (f, b) => { const r = await fetch(`${OS_URL}/rest/v1/rpc/${f}`, { method: "POST", headers: { "Content-Type": "application/json", apikey: OS_ANON, Authorization: "Bearer " + OS_ANON }, body: JSON.stringify(b) }); if (!r.ok) throw new Error(r.status); return r.json(); };
const toast = (t) => { $("msg").textContent = t; $("msg").style.display = "block"; setTimeout(() => $("msg").style.display = "none", 2600); };
const key = (a, p) => a + ":" + p, hm = (s) => new Date(s).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false });
const inG = (p, v, g) => g === "all" ? true : String(v === "bus" ? p.bus : v === "ban" ? p.ban : p.room) === String(g);
const count = (a, v, g) => { const l = D.roster.filter((p) => inG(p, v, g) && !p.absent); return [l.filter((p) => C[key(a, p.id)]).length, l.length]; };
const setAc = (k) => { AC = k; localStorage.setItem("trip_ac", AC); const a = D.activities.find((x) => x.k === k); if (a && a.m) { VIEW = a.m; localStorage.setItem("trip_view", VIEW); } };
const pickG = (g) => { SEL[VIEW] = g; localStorage.setItem("trip_sel", JSON.stringify(SEL)); draw(); window.scrollTo(0, 0); };
async function load() {
  if (busy) return;
  try { const d = await rpc("trip_get", { p_code: CODE }); if (busy) return; if (!d) { $("app").innerHTML = `<p class="e">링크가 맞지 않거나 사용 기간이 끝났어요.</p>`; return false; }
    D = d; C = {}; d.checks.forEach((c) => C[key(c.a, c.p)] = c); M = {}; (d.menus || []).forEach((m) => M[m.p] = m); if (!D.activities.some((a) => a.k === AC)) setAc(D.activities[0].k); document.title = D.title + " 체크"; if (!$("ov").innerHTML || !$("ov").dataset.keep) draw(); else if ($("ml") && document.activeElement.tagName !== "INPUT") paintMenu(); return true;
  } catch (e) { toast("인터넷 연결을 확인해 주세요"); return false; }
}
const callName = (p) => { const i = p.call ? p.ko.lastIndexOf(p.call) : -1; if (i < 0) return osEsc(p.ko); return osEsc(p.ko.slice(0, i)) + `<mark>${osEsc(p.call)}</mark>` + osEsc(p.ko.slice(i + p.call.length)); };
function draw() {
  const G = SEL[VIEW], ai = D.activities.findIndex((x) => x.k === AC), a = D.activities[ai], y = window.scrollY;
  document.documentElement.style.setProperty("--c", COLOR[VIEW === "bus" ? G : VIEW === "ban" ? G : "room"]);
  const [d, n] = count(AC, VIEW, G), rooms = [...new Set(D.roster.map((p) => p.room))].sort((p, q) => p - q);
  const L = D.roster.filter((p) => inG(p, VIEW, G)).sort((p, q) => p.ban.localeCompare(q.ban) || p.no - q.no || p.ko.localeCompare(q.ko)).filter((p) => !ONLY || (!p.absent && !C[key(AC, p.id)]));
  const tag = (p) => VIEW === "bus" ? `${p.ban}반 ${p.no}조<small>${osEsc(p.uni)} · ${p.room}번 방</small>` : VIEW === "ban" ? `${p.bus}호차<small>${osEsc(p.uni)} · ${p.room}번 방</small>` : `${p.bus}호차<small>${p.ban}반 ${p.no}조 · ${osEsc(p.uni)}</small>`;
  const row = (p) => { const c = p.absent ? null : C[key(AC, p.id)]; if (p.absent) return `<div class="r ab"><span class="ck">–</span><span class="n"><b>${osEsc(p.ko)}</b>${p.en ? `<i>${osEsc(p.en)}</i>` : ""}<u>결석 · 체크 제외</u></span><span class="tag">${tag(p)}</span>${p.tel ? `<a class="tel" href="tel:${p.tel}" aria-label="전화">📞</a>` : ""}</div>`; return `<div class="r${c ? " on" : ""}" data-p="${p.id}" role="button"><span class="ck">✓</span><span class="n"><b>${callName(p)}</b>${p.en ? `<i>${osEsc(p.en)}</i>` : ""}${mtag(p)}${p.tel ? `<i class="nb">${osEsc(p.tel)}</i>` : ""}${c ? `<u>${osEsc(c.by || "")} · ${hm(c.at)}</u>` : ""}</span><span class="tag">${tag(p)}</span>${p.tel ? `<a class="tel" href="tel:${p.tel}" aria-label="전화">📞</a>` : ""}</div>`; };
  const MN_ = (D.buses.menu_names || []), mtag = (p) => { if (!a.mn) return ""; const m = M[p.id] || {}; if (!m.menu) return `<i class="mtag no">🍽 메뉴 안 고름</i>`; return `<i class="mtag">🍽 ${osEsc(MN_[m.menu - 1] || ("메뉴" + m.menu))}${m.memo ? ` <em>· ${osEsc(m.memo)}</em>` : ""}</i>`; };
  const msum = () => { if (!a.mn) return ""; const l = D.roster.filter((p) => inG(p, VIEW, G) && !p.absent); return `<div class="msum">` + [1, 2, 3, 4].map((i) => { const t = l.filter((p) => (M[p.id] || {}).menu === i); return `<span>${osEsc(MN_[i - 1] || "메뉴" + i)} <b>${t.filter((p) => C[key(AC, p.id)]).length}/${t.length}</b></span>`; }).join("") + `</div>`; };
  const sec = (t, g) => g.length ? `<h3>${t}</h3><div class="list">${g.map(row).join("")}</div>` : "";
  let body = "";
  if (VIEW === "bus") body = sec("A반", L.filter((p) => p.ban === "A")) + sec("B반", L.filter((p) => p.ban === "B"));
  else if (VIEW === "ban") for (let t = 1; t <= 6; t++) body += sec(`${G}반 ${t}조`, L.filter((p) => p.no === t));
  else for (const r of rooms) body += sec(`${r}번 방`, L.filter((p) => p.room === r));
  const btn = (v, g, t) => { const [p, q] = count(AC, v, g); return `<button data-g="${g}" class="${String(G) === String(g) ? "on" : ""}">${t}<small>${p} / ${q}</small></button>`; };
  const pick = VIEW === "bus" ? `<div class="bus">${btn("bus", "1", "1호차")}${btn("bus", "2", "2호차")}${btn("bus", "3", "3호차")}</div>` : VIEW === "ban" ? `<div class="bus" style="grid-template-columns:1fr 1fr">${btn("ban", "A", "A반")}${btn("ban", "B", "B반")}</div>` : `<div class="rooms">${btn("room", "all", "전체")}${rooms.map((r) => btn("room", r, r + "번 방")).join("")}</div>`;
  const b = VIEW === "bus" ? D.buses[G] : null;
  $("app").innerHTML = `<header><div class="t"><span>${osEsc(D.title)}</span><button id="me">${osEsc(WHO || "이름")} ✎</button></div>
   <div class="tools"><button id="tt">🗓 시간표</button><button id="sh">📑 전체명단</button><button id="mn">🍽 메뉴</button><button id="tk">💬 영어</button><button id="sos">🚨 긴급</button></div>
   <div class="prow"><button class="step" id="pv"${ai ? "" : " disabled"}>‹</button><button class="pick" id="pick"><small>체크 시점 ${ai + 1} / ${D.activities.length} · ${osEsc(a.day)} ${osEsc(a.t)}</small>${osEsc(a.n)}</button><button class="step" id="nx"${ai < D.activities.length - 1 ? "" : " disabled"}>›</button></div>
