<style>
:root{--ink:#432f2e;--cream:#feefb8;--paper:#fff8e6;--sand:#ead9c6;--butter:#ffd84d}

body{background:#f6efe2;color:var(--ink);font-family:Pretendard,-apple-system,sans-serif;word-break:keep-all}

.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center}.tabs .tg{font-size:11.5px;font-weight:800;opacity:.45;margin:0 2px 0 10px;letter-spacing:.04em}.tabs .tg:first-child{margin-left:0}.tabs button{font:800 15px Pretendard;padding:10px 18px;border-radius:99px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}.tabs button.on{background:var(--ink);color:var(--cream)}

main{max-width:1180px;margin:0 auto;padding:24px 20px 80px}

.login h1{font-size:24px;margin-bottom:16px}

table{width:100%;border-collapse:collapse;background:#fff;border:2px solid var(--ink);border-radius:14px;overflow:hidden}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--sand);font-size:15px}th{background:var(--cream);font-size:13px}
tr.row{cursor:pointer}tr.row:hover{background:#fffaf0}

.st.인터뷰{background:#c4dae8}.st.제안{background:var(--butter)}.st.컨펌{background:#b9e3b2}.st.설치{background:#9fd39a}.st.완료{background:var(--ink);color:var(--cream)}
.bar{width:80px;height:6px;background:var(--sand);border-radius:9px;overflow:hidden;display:inline-block;vertical-align:middle}.bar i{display:block;height:100%;background:var(--ink)}
.grid{display:grid;grid-template-columns:1.05fr 1fr;gap:18px}@media(max-width:900px){.grid{grid-template-columns:1fr}}
.box{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:18px;margin-bottom:16px}
.box h3{font-size:16px;margin-bottom:10px}
.card{background:#fff;border:2px solid var(--ink);border-radius:18px;padding:18px 20px}

.chat{max-height:520px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.m{max-width:90%;padding:10px 13px;border-radius:14px;font-size:14.5px;line-height:1.6;white-space:pre-wrap}.m.ai{background:#f6efe2;align-self:flex-start}.m.me{background:var(--ink);color:var(--cream);align-self:flex-end}
.m a{color:inherit}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.note{font-size:13px;opacity:.65;margin-top:6px}
.err{color:#b3261e;margin-top:10px;font-size:14px}

/* 고객 통합 (2026-11-16) */
.flt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.flt button{font:800 14px Pretendard;padding:8px 14px;border-radius:99px;border:2px solid var(--ink);background:#fff;cursor:pointer}.flt button.on{background:var(--ink);color:var(--cream)}

.pv .box h3{display:flex;justify-content:space-between;align-items:center}.pv .kv2{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14px}.pv .kv2 dt{opacity:.55;font-weight:700}
.pv table{font-size:13.5px}.pv .emp{opacity:.5;font-size:13.5px}
</style></head><body>
<header><a href="../" title="퍼스널 OS 사이트로"><img src="../logo_butter.png" alt="BRANDiUM" style="height:20px;display:block"></a><span>퍼스널 OS 관리자</span><a class="hb" href="../">← 퍼스널 OS 사이트</a><button id="out" hidden>로그아웃</button></header>
<main id="main"></main>
<script>
const sb = supabase.createClient(OS_URL, OS_ANON);
const $ = (id) => document.getElementById(id), E = osEsc;
const STAGES = ["파악", "인터뷰", "제안", "컨펌", "설치", "완료"];
let JWT = null, CUR = null;
const SITE = location.origin + location.pathname.replace(/admin\/?.*$/, "");
async function A(body) { const r = await osCall(body, JWT); if (r.error && /관리자 로그인/.test(r.error)) { await sb.auth.signOut(); return boot(); } return r; }

function loginView() {
  $("out").hidden = true;
  $("main").innerHTML = `<div class="login"><h1>관리자 로그인</h1><input id="em" type="email" value="kedakorea@gmail.com"><input id="pw" type="password" placeholder="관리자 비밀번호"><button class="btn" id="go" style="width:100%;margin-top:14px">들어가기</button><p class="err" id="er"></p></div>`;
  const go = async () => { const { data, error } = await sb.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value }); if (error) { $("er").textContent = "로그인 실패: " + error.message; return; } JWT = data.session.access_token; people(); };
  $("go").onclick = go; $("pw").onkeydown = (e) => { if (e.key === "Enter") go(); };
}
async function list() {
  $("out").hidden = false; history.replaceState(null, "", location.pathname);
  $("main").innerHTML = `${tabs("c")}<div class="top"><h1>업무 파악 · 설계 (퍼스널 OS 고객)</h1><button class="btn y" id="newiv">🎙 새 고객 인터뷰 시작</button><button class="btn g" onclick="list()">새로고침</button></div><div id="tb">불러오는 중…</div>`;
  $("newiv").onclick = async () => { const nm = prompt("고객 이름을 적어 주세요 (메모: 날짜-이름-방식)", ""); if (!nm) return; const way = prompt("방식 (방문 / 원격 / 셀프 / 특강)", "방문") || "방문"; const k = await A({ action: "a_key_new", memo: `${yymmdd()}-${nm.trim()}-${way.trim()}`, n: 1 }); if (!k.ok) { alert(k.error); return; } window.open(`../start/?mode=interview&new=1&k=${k.codes[0]}`, "_blank"); };
  const r = await A({ action: "a_list" }); if (!r.ok) { $("tb").innerHTML = `<p class="err">${E(r.error)}</p>`; return; }
  const n = (s) => r.items.filter((x) => x.stage === s).length;
  $("tb").innerHTML = `<div class="stats">${STAGES.map((s) => `<div><b>${n(s)}</b>${s}</div>`).join("")}</div>
   <table><tr><th>고객</th><th>회사</th><th>키</th><th>단계</th><th>인터뷰</th><th>매니저</th><th>방식</th><th>최근</th></tr>
   ${r.items.map((x) => `<tr class="row" data-id="${x.id}"><td><b>${E(x.name)}</b><br><small>${E(x.phone || "")}</small></td><td>${E(x.company || "")}</td><td><code style="font-size:12px">${E(x.key_code || "")}</code></td><td><span class="st ${E(x.stage)}">${E(x.stage)}</span>${x.design_state === "running" ? " ✏️" : ""}${x.stage === "컨펌" ? ' <b style="color:#c0392b;font-size:12px">승인 대기</b>' : ""}</td><td><span class="bar"><i style="width:${x.progress || 0}%"></i></span> ${x.progress || 0}%</td><td>${E(x.chief || "")}</td><td>${E(x.mode || "")}</td><td>${new Date(x.updated_at).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })}</td></tr>`).join("") || `<tr><td colspan="8">아직 고객이 없습니다</td></tr>`}</table>`;
  document.querySelectorAll("tr.row").forEach((tr) => tr.onclick = () => detail(tr.dataset.id));
}
function yymmdd() { const d = new Date(); return String(d.getFullYear()).slice(2) + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0"); }
function tabs(on) {   // 2026-11-16 대표님: 고객 통합을 맨 앞에, 나머지는 '업무'·'설정' 묶음으로
  const b = (k, f, t) => `<button class="${on === k ? "on" : ""}" onclick="${f}()">${t}</button>`;
  return `<div class="tabs"><span class="tg">고객</span>${b("p", "people", "👤 고객 통합")}<span class="tg">업무</span>${b("o", "orders", "🛒 주문")}${b("b", "booking", "📅 예약")}${b("cl", "classAdmin", "🎓 강의실")}<span class="tg">설정·원본</span>${b("k", "keys", "🔑 고객 키")}${b("c", "list", "🎙 업무 파악")}${b("m", "members", "🙋 회원 원본")}</div>`;
}
// 설치 진행 체크리스트 (2026-10-24) — 1호 회고로 고친 순서. 시간표는 '시작'을 누르면 타이머, 목표 시간을 넘기면 빨간색(15분 넘으면 예비 방법)
const IC = [
 { sec: "A. 전날까지 — 준비", items: [
  ["a1", "고객 컴퓨터 확인: 맥 / 윈도우, 노트북 / 데스크톱, 늘 켜 둘 수 있는지"],
  ["a2", "전날 문자: 시간·주소 + 가져오실 것 5가지 (① 컴퓨터+충전기 ② 컴퓨터 로그인 비밀번호 ③ 휴대폰(구글·카카오 로그인) ④ 구글 계정 비밀번호 ⑤ 클로드 결제용 카드)"],
  ["a3", "클로드 Max 가입: 전날 미리 / 현장(20분) 정하기"],
  ["a4", "관리자 고객 키 상태 확인 · 입장 링크(start/?k=키) 복사"],
  ["a5", "설치 한 줄 복사 (맥: curl … | bash / 윈도우: 윈도우 설치 안내)"],
  ["a6", "연습 폴더에서 설치 한 번 끝까지 (윈도우면 윈도우로)"],
  ["a7", "와이파이 확인 + 휴대폰 핫스팟 예비 + USB 설치 키트"],
  ["a8", "대표님 맥북 충전 · 엘빈 앱 열어 두기"],
  ["a9", "출력: 진행 안내(고객용) · 막힘 노트 종이"]]},
 { sec: "B. 당일 시간표", timed: true, items: [
  ["b1", "인사·오늘 순서 안내 — 진행 안내 한 장 · 로그인·결제·비밀번호는 고객이 직접 · 화면 기록 허락", 10],
  ["b2", "인터뷰 — 칸마다 🎤 · 하루 흐름 · 가장 귀찮은 일 3개 · 맡기는 범위", 40],
  ["b3", "제안서 → 고치기 → 확정 — 부서·매니저 이름·호칭을 고객이 직접 읽고 \"네\"", 15],
  ["b4", "쉬는 시간 — 클로드 Max 가입 안 됐으면 같이", 10],
  ["b5", "설치 — 키트를 고객 다운로드 폴더로 · 한 줄 실행 · 클로드 로그인(고객) · 끝까지", 40],
  ["b6", "연결 3가지 — 캘린더 · 지메일 · 노션 (고객이 허용)", 30],
  ["b7", "앱·휴대폰 — 바탕화면 앱 · 휴대폰 홈 화면 추가 · 알림 한 번 받기 · 안드로이드면 테일스케일 '앱별 분할 터널링'에서 ⋮ → '포함할 앱만 고르기(Included apps)' 모드로 바꾼 뒤 크롬·삼성 인터넷만 체크 + '항상 켜진 VPN' 끄기 → 삼성페이·은행 앱 열리는지 확인", 15],
  ["b8", "첫 지시 5개 — 고객이 직접 입력: ① 브리핑 ② 일정 ③ 메일 초안 ④ 할일 ⑤ 문서 하나", 40],
  ["b9", "고객 일 하나 실제로 — 인터뷰의 '가장 귀찮은 일' 맡겨 보기", 20],
  ["b10", "마무리 — 사용 안내 · 30일 지원 안내 · 원격지원 프로그램 · 만족도 3문항 · 후기·사진 부탁", 20]]},
 { sec: "C. 끝내기 전 확인 (다 되면 설치 완료)", items: [
  ["c1", "고객이 혼자 앱을 켜고 지시를 넣을 수 있다"],
  ["c2", "휴대폰에서 지시 → 컴퓨터 처리 → 알림이 온다"],
  ["c3", "메일은 임시보관함까지만 간다는 걸 고객이 안다"],
  ["c4", "컴퓨터를 늘 켜 둬야 한다는 걸 안다(잠자기 설정 확인)"],
  ["c5", "문제 생기면 연락할 곳 · 30일 지원 기간을 안다"],
  ["c6", "원격으로 마무리할 일 목록을 같이 확인했다"]]},
 { sec: "D. 다음 날까지 — 정리", items: [
  ["d1", "감사 메시지 + 사용 안내 한 장 + 원격 마무리 일정"],
  ["d2", "막힘 노트 → 회고 판에 추가, 키트·사이트 고치기"],
  ["d3", "단계별 실제 걸린 시간 기록(아래 시간표 타이머 결과)"],
  ["d4", "세금계산서 / 현금영수증 발행"],
  ["d5", "후기·사진(허락받은 것) → 사례 창고"],
  ["d6", "1주 뒤 안부 연락 할일 등록"]]}
];
const IC_ALL = IC.flatMap((x) => x.items);
const mmss = (ms) => { const m = Math.floor(ms / 60000), s = Math.floor(ms % 60000 / 1000); return `${m}:${String(s).padStart(2, "0")}`; };
let ITIMER = null;
async function installs() {
  clearInterval(ITIMER); $("out").hidden = false;
  $("main").innerHTML = `${tabs("i")}<div class="top"><h1>설치 진행</h1><button class="btn y" id="newrun">＋ 새 설치</button><button class="btn g" onclick="installs()">새로고침</button></div><div id="tb">불러오는 중…</div>`;
  $("newrun").onclick = async () => { const c = prompt("고객 이름", ""); if (!c) return; const d = prompt("설치 날짜·시간 (예: 2026-11-02 14:00)", ""); const k = prompt("고객 키 (없으면 빈칸)", "") || null;
    const { data, error } = await sb.from("install_runs").insert({ customer: c.trim(), key_code: k, install_at: d ? new Date(d.replace(" ", "T") + ":00+09:00").toISOString() : null }).select().single();
    if (error) return alert(error.message); installRun(data.id); };
  const { data, error } = await sb.from("install_runs").select("*").order("install_at", { ascending: false, nullsFirst: false });
  if (error) { $("tb").innerHTML = `<p class="err">${E(error.message)}</p>`; return; }
  $("tb").innerHTML = data.length ? `<table><tr><th>고객</th><th>설치 일시</th><th>컴퓨터</th><th>진행</th><th>상태</th></tr>${data.map((r) => { const n = Object.keys(r.checks || {}).length;
    return `<tr class="row" data-id="${r.id}"><td><b>${E(r.customer)}</b><br><small>${E(r.key_code || "")}</small></td><td>${r.install_at ? new Date(r.install_at).toLocaleString("ko-KR", { timeZone: "Asia/Seoul", month: "numeric", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit" }) : "—"}</td><td>${E(r.os || "")}</td>
    <td><div style="background:#eee;border-radius:99px;height:10px;width:160px"><div style="background:var(--ink);height:10px;border-radius:99px;width:${Math.round(n / IC_ALL.length * 160)}px"></div></div><small>${n} / ${IC_ALL.length}</small></td><td>${r.finished_at ? "✅ 완료" : n ? "진행 중" : "준비"}</td></tr>`; }).join("")}</table>` : `<p class="note">아직 설치 건이 없습니다.</p>`;
  document.querySelectorAll("tr.row").forEach((tr) => tr.onclick = () => installRun(+tr.dataset.id));
}
async function installRun(id) {
  clearInterval(ITIMER);
  const { data: r, error } = await sb.from("install_runs").select("*").eq("id", id).single();
  if (error) return alert(error.message);
  const save = async (patch) => { Object.assign(r, patch); const { error } = await sb.from("install_runs").update(patch).eq("id", id); if (error) alert("저장 실패: " + error.message); };
  const draw = () => {
    const n = Object.keys(r.checks || {}).length, now = Date.now();
    $("main").innerHTML = `${tabs("i")}<div class="top"><h1>✅ ${E(r.customer)} 님 설치</h1><button class="btn g" onclick="installs()">← 목록</button></div>
