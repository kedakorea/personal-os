<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>관리자 | 퍼스널 OS</title>
<link rel="icon" type="image/png" href="../favicon.png?v=2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="../os.js"></script>
<style>
:root{--ink:#432f2e;--cream:#feefb8;--paper:#fff8e6;--sand:#ead9c6;--butter:#ffd84d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f6efe2;color:var(--ink);font-family:Pretendard,-apple-system,sans-serif;word-break:keep-all}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;background:var(--ink);color:var(--cream)}
header b{font:700 18px 'Josefin Sans',Pretendard}header span{opacity:.7;font-size:14px;flex:1}
header .hb{color:var(--cream);font-size:13px;text-decoration:none;border:1px solid var(--cream);border-radius:99px;padding:6px 14px}
.tabs{display:flex;gap:6px;margin-bottom:16px}.tabs button{font:800 15px Pretendard;padding:10px 18px;border-radius:99px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}.tabs button.on{background:var(--ink);color:var(--cream)}
code{font:700 15px Menlo,monospace;letter-spacing:.04em}
header button{background:none;border:1px solid var(--cream);color:var(--cream);border-radius:99px;padding:6px 14px;font:600 13px Pretendard;cursor:pointer}
main{max-width:1180px;margin:0 auto;padding:24px 20px 80px}
.login{max-width:380px;margin:80px auto;background:#fff;border:2px solid var(--ink);border-radius:20px;padding:30px}
.login h1{font-size:24px;margin-bottom:16px}
input,textarea,select{width:100%;font:16px/1.5 Pretendard;padding:11px 13px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);margin-top:8px}
.btn{font:800 15px Pretendard;padding:11px 18px;border-radius:99px;border:2px solid var(--ink);background:var(--ink);color:var(--cream);cursor:pointer;white-space:nowrap}
.btn.g{background:#fff;color:var(--ink)}.btn.y{background:var(--butter);color:var(--ink)}.btn.r{background:#fff;color:#b3261e;border-color:#b3261e}
.btn:disabled{opacity:.4}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.top h1{font-size:26px;flex:1}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.stats div{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:10px 16px;font-size:14px}.stats b{font-size:22px;display:block}
table{width:100%;border-collapse:collapse;background:#fff;border:2px solid var(--ink);border-radius:14px;overflow:hidden}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--sand);font-size:15px}th{background:var(--cream);font-size:13px}
tr.row{cursor:pointer}tr.row:hover{background:#fffaf0}
.st{display:inline-block;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:800;background:var(--sand)}
.st.인터뷰{background:#c4dae8}.st.제안{background:var(--butter)}.st.컨펌{background:#b9e3b2}.st.설치{background:#9fd39a}.st.완료{background:var(--ink);color:var(--cream)}
.bar{width:80px;height:6px;background:var(--sand);border-radius:9px;overflow:hidden;display:inline-block;vertical-align:middle}.bar i{display:block;height:100%;background:var(--ink)}
.grid{display:grid;grid-template-columns:1.05fr 1fr;gap:18px}@media(max-width:900px){.grid{grid-template-columns:1fr}}
.box{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:18px;margin-bottom:16px}
.box h3{font-size:16px;margin-bottom:10px}
.kv{font-size:14.5px;line-height:1.8;white-space:pre-wrap}
.chat{max-height:520px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.m{max-width:90%;padding:10px 13px;border-radius:14px;font-size:14.5px;line-height:1.6;white-space:pre-wrap}.m.ai{background:#f6efe2;align-self:flex-start}.m.me{background:var(--ink);color:var(--cream);align-self:flex-end}
.m a{color:inherit}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.note{font-size:13px;opacity:.65;margin-top:6px}
.err{color:#b3261e;margin-top:10px;font-size:14px}
</style></head><body>
<header><a href="../" title="퍼스널 OS 사이트로"><img src="../logo_butter.png" alt="BRANDiUM" style="height:20px;display:block"></a><span>퍼스널 OS 관리자</span><a class="hb" href="../">← 퍼스널 OS 사이트</a><button id="out" hidden>로그아웃</button></header>
<main id="main"></main>
<script>
const sb = supabase.createClient(OS_URL, OS_ANON);
const $ = (id) => document.getElementById(id), E = osEsc;
const STAGES = ["파악", "인터뷰", "제안", "컨펌", "설치", "완료"];
let JWT = null, CUR = null;
const SITE = location.origin + location.pathname.replace(/admin\/?.*$/, "");
async function A(body) { const r = await osCall(body, JWT); if (r.error && /관리자 로그인/.test(r.error)) { await sb.auth.signOut(); return boot(); } return r; }

function loginView() {
  $("out").hidden = true;
  $("main").innerHTML = `<div class="login"><h1>관리자 로그인</h1><input id="em" type="email" value="kedakorea@gmail.com"><input id="pw" type="password" placeholder="관리자 비밀번호"><button class="btn" id="go" style="width:100%;margin-top:14px">들어가기</button><p class="err" id="er"></p></div>`;
  const go = async () => { const { data, error } = await sb.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value }); if (error) { $("er").textContent = "로그인 실패: " + error.message; return; } JWT = data.session.access_token; list(); };
  $("go").onclick = go; $("pw").onkeydown = (e) => { if (e.key === "Enter") go(); };
}
async function list() {
  $("out").hidden = false; history.replaceState(null, "", location.pathname);
  $("main").innerHTML = `${tabs("c")}<div class="top"><h1>고객</h1><button class="btn y" id="newiv">🎙 새 고객 인터뷰 시작</button><button class="btn g" onclick="list()">새로고침</button></div><div id="tb">불러오는 중…</div>`;
  $("newiv").onclick = async () => { const nm = prompt("고객 이름을 적어 주세요 (메모: 날짜-이름-방식)", ""); if (!nm) return; const way = prompt("방식 (방문 / 원격 / 셀프 / 특강)", "방문") || "방문"; const k = await A({ action: "a_key_new", memo: `${yymmdd()}-${nm.trim()}-${way.trim()}`, n: 1 }); if (!k.ok) { alert(k.error); return; } window.open(`../start/?mode=interview&new=1&k=${k.codes[0]}`, "_blank"); };
  const r = await A({ action: "a_list" }); if (!r.ok) { $("tb").innerHTML = `<p class="err">${E(r.error)}</p>`; return; }
  const n = (s) => r.items.filter((x) => x.stage === s).length;
  $("tb").innerHTML = `<div class="stats">${STAGES.map((s) => `<div><b>${n(s)}</b>${s}</div>`).join("")}</div>
   <table><tr><th>고객</th><th>회사</th><th>키</th><th>단계</th><th>인터뷰</th><th>매니저</th><th>방식</th><th>최근</th></tr>
   ${r.items.map((x) => `<tr class="row" data-id="${x.id}"><td><b>${E(x.name)}</b><br><small>${E(x.phone || "")}</small></td><td>${E(x.company || "")}</td><td><code style="font-size:12px">${E(x.key_code || "")}</code></td><td><span class="st ${E(x.stage)}">${E(x.stage)}</span>${x.design_state === "running" ? " ✏️" : ""}${x.stage === "컨펌" ? ' <b style="color:#c0392b;font-size:12px">승인 대기</b>' : ""}</td><td><span class="bar"><i style="width:${x.progress || 0}%"></i></span> ${x.progress || 0}%</td><td>${E(x.chief || "")}</td><td>${E(x.mode || "")}</td><td>${new Date(x.updated_at).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })}</td></tr>`).join("") || `<tr><td colspan="8">아직 고객이 없습니다</td></tr>`}</table>`;
  document.querySelectorAll("tr.row").forEach((tr) => tr.onclick = () => detail(tr.dataset.id));
}
function yymmdd() { const d = new Date(); return String(d.getFullYear()).slice(2) + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0"); }
function tabs(on) { return `<div class="tabs"><button class="${on === "c" ? "on" : ""}" onclick="list()">👥 고객</button><button class="${on === "k" ? "on" : ""}" onclick="keys()">🔑 고객 키</button></div>`; }
async function keys() {
  history.replaceState(null, "", "?tab=keys");
  $("main").innerHTML = `${tabs("k")}<div class="top"><h1>고객 키</h1></div>
   <div class="box"><h3>새 키 만들기</h3><p class="note" style="margin-top:0">키를 받은 고객만 업무 파악·AI 인터뷰 화면에 들어갈 수 있습니다. 한 키 = 고객 한 명. 같은 키로 다시 들어오면 하던 곳부터 이어집니다.</p>
   <div class="row2"><input id="kd" value="${yymmdd()}" style="width:100px;margin:0" title="날짜 YYMMDD"><input id="kname" placeholder="고객 이름 (예: 조연심)" style="flex:1;margin:0;min-width:160px"><select id="kway" style="width:auto;margin:0">${["방문", "원격", "셀프", "특강", "출장", "기타"].map((x) => `<option>${x}</option>`).join("")}</select><input id="kn" type="number" value="1" min="1" max="20" style="width:70px;margin:0" title="개수"><button class="btn" id="kmk">키 만들기</button></div>
   <p class="note">메모는 <b id="kprev"></b> 로 저장됩니다 (날짜-이름-방식)</p>
   <div id="kl">불러오는 중…</div>`;
  const memo = () => [$("kd").value.trim(), $("kname").value.trim(), $("kway").value].filter(Boolean).join("-");
  const pv = () => $("kprev").textContent = memo(); ["kd", "kname", "kway"].forEach((i) => $(i).oninput = $(i).onchange = pv); pv();
  $("kmk").onclick = async () => { if (!$("kname").value.trim()) { $("kname").focus(); return; } const r = await A({ action: "a_key_new", memo: memo(), n: +$("kn").value || 1 }); if (!r.ok) { alert(r.error); return; }
    $("kout").innerHTML = `<p class="note">만든 키 — 고객에게 보낼 문구를 복사하세요</p>` + r.codes.map((c) => `<div class="row2"><code>${c}</code><button class="btn g" data-cp="${c}">안내문 복사</button></div>`).join("");
    bindCopy(); loadKeys(); };
  loadKeys();
}
function keyMsg(c) { return `[브랜디움 퍼스널 OS] 업무 파악 안내\n아래 주소에서 고객 키를 넣고 시작해 주세요 (10~20분).\n${SITE}start/?k=${c}\n고객 키: ${c}`; }
function bindCopy() { document.querySelectorAll("[data-cp]").forEach((b) => b.onclick = async () => { await navigator.clipboard.writeText(keyMsg(b.dataset.cp)); b.textContent = "복사됨 ✓"; }); }
async function loadKeys() {
  const r = await A({ action: "a_keys" }); if (!r.ok) { $("kl").innerHTML = `<p class="err">${E(r.error)}</p>`; return; }
  $("kl").innerHTML = `<table><tr><th>키</th><th>메모</th><th>상태</th><th>고객</th><th>만든 날</th><th></th></tr>${r.items.map((k) => `<tr><td><code>${E(k.code)}</code></td><td>${E(k.memo || "")}</td><td><span class="st">${E(k.status)}</span></td><td>${k.customers ? `<a href="#" data-cid="${k.customer_id}">${E(k.customers.name || "")}</a> <small>${E(k.customers.stage || "")}</small>` : ""}</td><td>${new Date(k.created_at).toLocaleDateString("ko-KR")}</td>
    <td style="white-space:nowrap"><button class="btn g" data-cp="${E(k.code)}">안내문 복사</button> <button class="btn g" data-st="${E(k.code)}" data-s="${k.status === "중지" ? (k.customer_id ? "사용 중" : "대기") : "중지"}">${k.status === "중지" ? "다시 열기" : "멈추기"}</button> ${k.customer_id ? "" : `<button class="btn r" data-del="${E(k.code)}">삭제</button>`}</td></tr>`).join("") || `<tr><td colspan="6">아직 만든 키가 없습니다</td></tr>`}</table>`;
  bindCopy();
  document.querySelectorAll("[data-st]").forEach((b) => b.onclick = async () => { await A({ action: "a_key_update", code: b.dataset.st, status: b.dataset.s }); loadKeys(); });
  document.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => { if (confirm(b.dataset.del + " 키를 지울까요?")) { await A({ action: "a_key_delete", code: b.dataset.del }); loadKeys(); } });
  document.querySelectorAll("[data-cid]").forEach((a) => a.onclick = (e) => { e.preventDefault(); detail(a.dataset.cid); });
}
function intakeText(c) {
  const a = (c.intake && c.intake.a) || {}, j = (x) => Array.isArray(x) ? x.join(", ") : (x || "");
  const L = [["직함", a.role], ["호칭", a.call], ["소개", a.intro], ["함께 일하는 사람", a.people], ["맡길 일", j(a.work) + (a.work_etc ? " / " + a.work_etc : "")], ["어려운 일", j(a.hard)], ["오래 걸리는 일", j(a.long)], ["쉽지만 오래 걸리는 일", j(a.easylong)], ["나만 할 수 있는 일", j(a.onlyme)], ["덧붙임", a.split_more], ["맡기고 싶은 일", j(a.delegate)], ["어제 하루", a.day], ["놓친 일", a.missed], ["해 보고 싶은 일", a.want], ["해야 할 일", a.must], ["메일", j(a.mail)], ["일정", j(a.cal)], ["연락", j(a.chat)], ["문서", j(a.doc)], ["채널", j(a.ch)], ["AI", j(a.ai)], ["확인받을 일", j(a.ask)], ["직접 할 일", a.never], ["컴퓨터", [a.pctype, a.pc].filter(Boolean).join(" · ")], ["켜 두기", a.on], ["휴대폰", a.phone], ["말투", a.tone], ["브리핑", j(a.brief)], ["매니저 호칭", a.chief_title], ["매니저 이름 아이디어", a.chief]];
  const memo = Object.values((c.intake && c.intake.memo) || {}).filter(Boolean);
  return L.filter(([, v]) => v).map(([k, v]) => `<b>${k}</b> ${E(v)}`).join("\n") + (memo.length ? `\n<b>인터뷰 메모</b> ${E(memo.join(" / "))}` : "");
}
async function detail(id) {
  history.replaceState(null, "", "?id=" + id);
  $("main").innerHTML = "불러오는 중…";
  const r = await A({ action: "a_get", id }); if (!r.ok) { $("main").innerHTML = `<p class="err">${E(r.error)}</p>`; return; }
  const c = r.customer; CUR = r;
  const link = SITE + "start/?t=" + c.token; // 키 없이 바로 이어지는 고객 전용 주소
  $("main").innerHTML = `<style>${OS_PROP_CSS}</style>
   <div class="top"><button class="btn g" onclick="list()">← 목록</button><h1>${E(c.name)} <small style="font-size:16px;opacity:.6">${E(c.company || "")} · ${E(c.phone || "")}</small></h1></div>
   <div class="box"><div class="row2" style="margin-top:0">
     <select id="stg" style="width:auto;margin:0">${STAGES.map((s) => `<option ${s === c.stage ? "selected" : ""}>${s}</option>`).join("")}</select>
     <button class="btn g" id="svs">단계 저장</button>
     <button class="btn g" id="cp">고객 링크 복사</button>
     <button class="btn y" id="pub" ${c.design ? "" : "disabled"}>${(c.intake || {}).kit ? "🔄 키트 다시 올리기" : "✅ 승인 · 고객 페이지에 키트 올리기"}</button>
     <button class="btn g" id="kit" ${c.design ? "" : "disabled"}>📦 내 컴퓨터로 받기</button>
     <button class="btn r" id="del" style="margin-left:auto">삭제</button></div>
     <p class="note" id="pubst">${(c.intake || {}).kit ? `✅ 승인됨 — ${E(new Date(c.intake.kit.at).toLocaleString("ko-KR"))} 고객 페이지에 키트를 올렸습니다 (${E(c.intake.kit.name)}, ${Math.round((c.intake.kit.size || 0) / 1024)}KB) · <a href="#" id="unpub">승인 취소</a>` : (["컨펌", "설치"].includes(c.stage) ? "⏳ 고객이 확정했습니다 — <b>승인</b>을 누르면 고객 전용 페이지에서 각자 설치 키트를 받습니다" : "")}</p>
     <p class="note">고객 링크: <a href="${E(link)}" target="_blank">${E(link)}</a> — 고객이 이 주소로 들어가면 이어서 인터뷰·제안서·컨펌을 할 수 있습니다.</p>
     <p class="note">🖥 <b>설치 시작</b> — 고객 PC의 <b>다운로드 폴더</b>에 키트를 받은 뒤, 터미널에 아래 한 줄을 붙여넣기 (설치.command 더블클릭 대신 · '열지 않음' 경고 없음)<br><code id="instcmd" style="user-select:all;background:#fff;border:1px solid #ccc;padding:4px 8px;display:inline-block;margin-top:4px">curl -fsSL https://kedakorea.github.io/personal-os/tools/install.sh | bash</code> <button class="btn g" type="button" onclick="navigator.clipboard.writeText(document.getElementById('instcmd').textContent);this.textContent='복사됨'">복사</button></p>
     <textarea id="memo" placeholder="관리자 메모 (고객에게는 안 보임)" style="min-height:70px">${E(c.notes || "")}</textarea><div class="row2"><button class="btn g" id="svm">메모 저장</button><span id="msg" class="note"></span></div></div>
   <div class="grid"><div>
     <div class="box"><h3>📁 넘겨받은 자료 (${(c.assets || []).length})</h3>${(c.assets || []).map((a) => `<div>📎 <b>${E(a.kind)}</b> · <a href="${E(a.url || "#")}" target="_blank">${E(a.name.replace(a.kind + "_", ""))}</a></div>`).join("") || "<p class='note'>아직 없습니다 — 고객이 확정 뒤 '넘겨줄 자료' 화면에서 올립니다</p>"}</div>
     <div class="box"><h3>📝 카드·질문 답</h3><div class="kv">${intakeText(c) || "(없음)"}</div></div>
     <div class="box"><h3>🎙 AI 인터뷰 (${r.messages.length})</h3><div class="chat">${r.messages.map((m) => `<div class="m ${m.role === "ai" ? "ai" : "me"}">${E(m.text)}${(m.files || []).map((f) => `<br>📎 <a href="${E(f.url || "#")}" target="_blank">${E(f.name)}</a>`).join("")}</div>`).join("") || "(아직 없음)"}</div></div>
   </div><div>
     <div class="box"><h3>📄 제안서 ${c.design_state === "running" ? "✏️ 만드는 중…" : ""}</h3>${c.design ? osProposal(c.design, c.chief, { done: ["컨펌", "설치", "완료"].includes(c.stage) }) : "<p class='note'>아직 없습니다</p>"}
       <textarea id="rq" placeholder="AI에게 설계 수정 요청 (예: 연구실 빼고 홍보실을 둘로)" style="min-height:60px"></textarea>
       <div class="row2"><button class="btn g" id="redo">🤖 AI로 ${c.design ? "다시" : ""} 만들기</button><span id="dmsg" class="note"></span></div>
       <details style="margin-top:12px"><summary style="cursor:pointer;font-size:14px">설계 원본(JSON) 직접 고치기</summary><textarea id="dj" style="min-height:260px;font:12.5px/1.5 Menlo,monospace">${E(JSON.stringify(c.design || {}, null, 1))}</textarea><button class="btn g" id="svd" style="margin-top:8px">설계 저장</button></details>
     </div>
   </div></div>`;
  const say = (t) => { $("msg").textContent = t; setTimeout(() => $("msg").textContent = "", 3000); };
  $("svs").onclick = async () => { await A({ action: "a_update", id, fields: { stage: $("stg").value } }); say("저장했습니다"); };
  $("svm").onclick = async () => { await A({ action: "a_update", id, fields: { notes: $("memo").value } }); say("저장했습니다"); };
  $("cp").onclick = async () => { await navigator.clipboard.writeText(link); say("복사했습니다"); };
  $("del").onclick = async () => { if (confirm(c.name + " 기록을 모두 지울까요? 되돌릴 수 없습니다.")) { await A({ action: "a_delete", id }); list(); } };
  $("redo").onclick = async () => { $("redo").disabled = true; $("dmsg").textContent = "만드는 중… (30초~1분)"; const x = await A({ action: "a_design", id, request: $("rq").value.trim() }); if (!x.ok) alert(x.error); detail(id); };
  $("svd").onclick = async () => { let d; try { d = JSON.parse($("dj").value); } catch (e) { alert("JSON 형식이 틀렸습니다: " + e.message); return; } await A({ action: "a_update", id, fields: { design: d } }); detail(id); };
  $("kit").onclick = () => buildKit(c);
  $("pub").onclick = () => buildKit(c, true);
  if ($("unpub")) $("unpub").onclick = async (e) => { e.preventDefault(); if (!confirm("고객 페이지에서 설치 키트를 내릴까요?")) return; await A({ action: "a_kit_revoke", id }); detail(id); };
}
async function buildKit(c, publish) {
  const d = c.design; if (!d) return;
  const btn = $(publish ? "pub" : "kit"), label = btn.textContent;
  if (publish && !confirm(c.name + " 님 설치 키트를 승인해 고객 페이지에 올릴까요?\n(고객이 올린 회사 자료까지 함께 들어갑니다)")) return;
  btn.disabled = true; btn.textContent = "📦 포장하는 중…";
  try {
    const k = await A({ action: "a_kit" });
    const zip = await JSZip.loadAsync(await (await fetch(k.url)).arrayBuffer());
    const top = Object.keys(zip.files)[0].split("/")[0] + "/";
    const set = Object.assign({ 직함: "매니저" }, d.설정 || {}); set.실장 = (c.chief || "").trim() || set.직함;   // 이름이 없으면 호칭이 곧 이름 set.회사 = set.회사 || c.company || "";
    const full = set.실장 === set.직함 ? set.직함 : set.실장 + " " + set.직함;
    const fill = (t) => String(t || "").split("{{매니저}}").join(full).split(set.직함 + " {{실장}}").join(full).split("{{실장}} {{직함}}").join(set.실장 === set.직함 ? set.직함 : set.실장 + " " + set.직함).split("{{직함}}").join(set.직함 || "매니저").split("{{실장}}").join(set.실장 || "매니저").split("{{호칭}}").join(set.호칭 || "대표님").split("{{회사}}").join(set.회사 || "").split(set.직함 + " " + set.직함).join(set.직함);
    zip.file(top + "설계/설정.json", JSON.stringify(set, null, 1));
    zip.file(top + "설계/부서/부서표.json", JSON.stringify({ 부서: (d.부서 || []).map(({ 지침, ...x }) => x) }, null, 1));
    for (const dep of d.부서 || []) if (dep.폴더 && dep.폴더 !== "00_비서실" && dep.지침) zip.file(top + `설계/부서/${dep.폴더}/CLAUDE.md`, `# ${dep.이름} 지침\n\n` + fill(dep.지침) + "\n");
    if (d.첫인사) zip.file(top + "설계/첫인사.md", fill(d.첫인사) + "\n\n설치·사용 중 막히시면 브랜디움 카카오톡 채널로 편하게 물어보세요 → https://pf.kakao.com/_gMxogd");
    // 고객이 올린 회사 자료 (로고·직인·사업자등록증 등)
    for (const a of (CUR.customer.assets || [])) { if (!a.url) continue; try { const blob = await (await fetch(a.url)).blob(); zip.file(top + "설계/회사자료/" + a.name, blob); } catch (e) {} }
    const blob = await zip.generateAsync({ type: "blob", platform: "UNIX", compression: "DEFLATE" });
    const fname = `퍼스널OS_설치키트_${c.name}_${new Date().toISOString().slice(2, 10).replace(/-/g, "")}.zip`;
    if (publish) {
      btn.textContent = "⬆️ 고객 페이지에 올리는 중…";
      const b64 = await new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(blob); });
      const x = await A({ action: "a_kit_publish", id: c.id, zip: b64, name: fname });
      if (!x.ok) throw new Error(x.error || "올리지 못했습니다");
      return detail(c.id);
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = fname; a.click();
    if (c.stage === "컨펌" || c.stage === "제안") await A({ action: "a_update", id: c.id, fields: { stage: "설치" } });
    btn.textContent = "✅ 내려받았습니다";
  } catch (e) { alert("키트를 만들지 못했습니다: " + e.message); btn.disabled = false; btn.textContent = label; }
}
async function boot() {
  const { data } = await sb.auth.getSession();
  if (!data.session) return loginView();
  JWT = data.session.access_token;
  const q = new URLSearchParams(location.search), id = q.get("id");
  id ? detail(id) : (q.get("tab") === "keys" ? keys() : list());
}
sb.auth.onAuthStateChange((_e, s) => { JWT = s ? s.access_token : null; });
$("out").onclick = async () => { await sb.auth.signOut(); loginView(); };
boot();
</script>
